<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K2 Expense Approve</title>
  <meta name="theme-color" content="#044fa5">
  <meta name="apple-mobile-web-app-title" content="K2 Approve">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    html, body { margin: 0; padding: 0; background: #f4f6fb; overflow: hidden; height: 100%; height: 100svh; }
    iframe { display: block; border: 0; width: 100%; height: 100%; height: 100svh; }
</style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbyA4tFhxt0AMqHcs6dUbM6UIknW7OLqeLkYlc165Y_FoGoTbqnFeijJQCdJeSh7omWp/exec"
    title="K2 Expense Approve"
    allow="clipboard-write"></iframe>

  <script>
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var frame = document.querySelector('iframe');
    function fit() {
      var h = Math.round(vv.height);
      document.documentElement.style.height = h + 'px';
      document.body.style.height = h + 'px';
      frame.style.position = 'fixed';
      frame.style.left = Math.round(vv.offsetLeft) + 'px';
      frame.style.top = Math.round(vv.offsetTop) + 'px';
      frame.style.width = Math.round(vv.width) + 'px';
      frame.style.height = h + 'px';
    }
    fit();
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
    addEventListener('scroll', fit);
    addEventListener('orientationchange', fit);
  }());
  </script>
</body>
</html>
