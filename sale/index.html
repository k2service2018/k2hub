<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K2 Sale System</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-title" content="K2 Sale">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f9e44'/><text x='16' y='22' font-size='16' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>K2</text></svg>">
  <style>
    /* ⚠️ วัดจริงบน iPhone แล้ว ห้ามเปลี่ยนกลับเป็น height:100% + position:fixed
     *
     * ตัวเลขจาก Safari ตอนที่ยังพัง:
     *     doc.clientHeight      659   <- layout viewport (สูงเท่าตอนซ่อนแถบ URL)
     *     visualViewport.height 606   <- ที่มองเห็นจริง
     *     window.scrollY         52
     *     iframe rect.top       -52   <- ขอบบนของเฟรมหลุดขึ้นไปเหนือจอ
     *
     * ลูกโซ่ของอาการ: height:100% วัดเทียบ layout viewport จึงได้ 659 สูงกว่าที่เห็น 53px
     * -> หน้ามีที่ให้เลื่อน -> Safari เลื่อนไปเอง 52px (overflow:hidden กันผู้ใช้เลื่อนได้
     * แต่กันเบราว์เซอร์เลื่อนเองไม่ได้) -> position:fixed บน iOS อ้างอิง layout viewport
     * ที่ถูกเลื่อนไปแล้ว เฟรมจึงขยับขึ้นตาม -> ส่วนบนของแอปราว 52px ถูกบัง ดึงกลับไม่ได้
     *
     * 100dvh คือความสูงที่มองเห็นจริง ทั้งหน้าจึงสูงเท่าที่เห็นพอดี ไม่เหลือที่ให้เลื่อน
     * เมื่อไม่มีที่ให้เลื่อน scrollY ก็เป็น 0 ตลอด และ rect.top เป็น 0 ตาม
     * height:100% ที่อยู่ก่อนหน้าเป็นทางถอยของเบราว์เซอร์เก่าที่ไม่รู้จัก dvh
     *
     * เอา position:fixed ออกด้วย เพราะบน iOS มันอ้างอิง layout viewport ไม่ใช่ที่เห็นจริง
     * (เดิมใส่ไว้กันเฟรมยืดตามเนื้อหา — ตอนนี้หน้าในตั้ง height:100dvh + overflow:hidden
     *  ไว้แล้ว เฟรมจึงไม่มีเหตุให้ยืด และ overflow:hidden ตรงนี้ยังคลุมไว้อีกชั้น)
     *
     * บนเบราว์เซอร์ในแอป LINE ไม่เคยมีอาการนี้ เพราะทุกค่าเท่ากันหมด (669) — จอเดียวกัน
     * แต่คนละเบราว์เซอร์ให้ผลคนละอย่าง จึงต้องวัดบนเครื่องจริง ไม่ใช่เดา
     */
    html, body { margin: 0; padding: 0; background: #f4f6fb; overflow: hidden; height: 100%; height: 100svh; }
    iframe { display: block; border: 0; width: 100%; height: 100%; height: 100svh; }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbycxVaAS_DVU0hEJn1Mnq-B-QMp069E5yNknNM3CbwAHdwiaCl2nde94ribtdQk6VtRsQ/exec"
    title="K2 Sale System"
    allow="clipboard-write"></iframe>

  <script>
  /* ความสูงของเฟรมมาจาก **ค่าที่วัดได้** ไม่ใช่จากหน่วย CSS
   *
   * ⚠️ วัดจริงบน iPhone แล้ว: 100dvh คายค่าออกมาเป็น 659px ทั้งที่พื้นที่ที่มองเห็นจริง
   *    (visualViewport.height) คือ 606px — หน่วย viewport ของ CSS จึงเชื่อไม่ได้ที่นี่
   *    เฟรมสูงเกินจอ 53px ส่วนล่างของแอป (แถบเมนู) เลยตกขอบไป
   *
   * visualViewport.height คือพื้นที่ที่มองเห็นจริง ๆ หลังหักแถบของเบราว์เซอร์แล้ว
   * ตั้งความสูงตามค่านี้ตรง ๆ จึงพอดีเสมอ ไม่ว่าแถบ URL จะโผล่หรือหุบ
   *
   * ตั้งให้ html และ body ด้วย ไม่ใช่แค่ iframe — ถ้าหน้ายังสูงกว่าที่มองเห็น
   * จะมีที่ให้เลื่อน แล้ว Safari จะเลื่อนเองจนส่วนบนของแอปถูกบัง (อาการเดิม)
   *
   * เบราว์เซอร์ที่ไม่มี visualViewport ตกไปใช้ 100svh ใน CSS ข้างบน
   */
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var frame = document.querySelector('iframe');

    function fit() {
      var h = Math.round(vv.height);
      document.documentElement.style.height = h + 'px';
      document.body.style.height = h + 'px';

      /* ⚠️ ตั้งแต่ความสูงอย่างเดียวไม่พอ — ต้องชดเชย offsetTop ด้วย
       *
       * รอบก่อนตั้งความสูงให้พอดีแล้ว แต่ส่วนบนยังถูกบังอยู่ ตัวเลขอธิบายว่าทำไม:
       * พอหน้าไม่มีที่ให้เลื่อน Safari จะกางแถบ URL ค้างไว้ แล้ววาง**ทับ**ส่วนบนของหน้า
       * แทนที่จะเบียดพื้นที่ลงมา — visualViewport.offsetTop จึงกลายเป็น 52
       * แปลว่าเนื้อหาที่ y=0 ถึง 52 อยู่ใต้แถบ URL มองไม่เห็น
       *
       * position:fixed อ้างอิง layout viewport ซึ่งเริ่มที่ y=0 (ใต้แถบ URL ขึ้นไป)
       * ส่วน offsetTop คือระยะห่างระหว่างจุดนั้นกับขอบบนของพื้นที่ที่มองเห็นจริง
       * บวกเข้าไปเฟรมจึงไปเริ่มตรงขอบบนของพื้นที่ที่เห็นพอดี
       *
       * ทั้ง height และ offsetTop เป็นค่าที่**วัดได้จากเครื่องจริง** ไม่ใช่หน่วยที่ต้องเดา
       * ว่าเบราว์เซอร์จะตีความยังไง (100dvh ให้ 659 ทั้งที่มองเห็นแค่ 606 มาแล้ว)
       */
      frame.style.position = 'fixed';
      frame.style.left = Math.round(vv.offsetLeft) + 'px';
      frame.style.top = Math.round(vv.offsetTop) + 'px';
      frame.style.width = Math.round(vv.width) + 'px';
      frame.style.height = h + 'px';
    }

    fit();
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);      // offsetTop ขยับตอนเลื่อน ต้องตามให้ทัน
    addEventListener('scroll', fit);
    addEventListener('orientationchange', fit);
  }());
  </script>
</body>
</html>
