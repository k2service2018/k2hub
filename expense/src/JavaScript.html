  return (root || document).querySelector(sel);
};

  return Array.prototype.slice.call((root || document).querySelectorAll(sel));
};

function el(tag, attrs, children) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function(k) {
    if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else if (k === 'html') n.innerHTML = attrs[k]; else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function(c) {
    if (c) n.appendChild(c);
  });
  return n;
}

function num(v) {
  if (v === '' || v === null || v === undefined) return 0;
  var n = Number(String(v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}

function money(n) {
  return num(n).toLocaleString('th-TH', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function t(k) {
  var d = I18N[LANG] || I18N.th;
  if (k in d) return d[k];
  return I18N.th[k] !== undefined ? I18N.th[k] : k;
}

function L(o, field) {
  if (!o) return '';
  var f = field || (LANG === 'en' ? 'en' : 'th');
  var alt = f === 'en' ? 'th' : 'en';
  return o[f] || o[alt] || '';
}

function renderIcons() {
  if (typeof lucide !== 'undefined' && lucide.createIcons) {
    setTimeout(function() {
      lucide.createIcons();
    }, 10);
  }
}

function applyTheme(mode) {
  THEME = mode === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);
  try {
    localStorage.setItem(THEME_KEY, THEME);
  } catch (e) {}
  var dark = THEME === 'dark';
  var html = dark ? '<i data-lucide="sun" class="icon-md"></i>' : '<i data-lucide="moon" class="icon-md"></i>';
  [ '#themeAuth', '#themeApp' ].forEach(function(sel) {
    var b = $(sel);
    if (!b) return;
    b.innerHTML = html;
    b.title = dark ? 'Light mode' : 'Dark mode';
  });
  renderIcons();
}

function toggleTheme() {
  applyTheme(THEME === 'dark' ? 'light' : 'dark');
}

function applyStatic() {
  document.documentElement.setAttribute('lang', LANG);
  $$('[data-i18n]').forEach(function(n) {
    n.textContent = t(n.getAttribute('data-i18n'));
  });
  var other = LANG === 'th' ? 'EN' : 'ไทย';
  [ '#langAuth', '#langApp' ].forEach(function(sel) {
    var b = $(sel);
    if (b) b.innerHTML = '<i data-lucide="globe" class="icon-sm"></i><span>' + other + '</span>';
  });
  var ph = {
    '#fQuery': 'ph_search_claims',
    '#aQuery': 'ph_search_users',
    '#note': 'ph_note',
    '#rvComment': 'ph_review_comment'
  };
  Object.keys(ph).forEach(function(sel) {
    var n = $(sel);
    if (n) n.setAttribute('placeholder', t(ph[sel]));
  });
  var modalTitle = $('#modalTitle');
  if (modalTitle && !modalTitle.textContent) modalTitle.textContent = t('confirm_title');
  renderIcons();
}

function setLang(lang) {
  LANG = lang === 'en' ? 'en' : 'th';
  try {
    localStorage.setItem(LANG_KEY, LANG);
  } catch (e) {}
  applyStatic();
  if (!BOOT) return;
  rebuildLocalizedUi();
}

function toggleLang() {
  setLang(LANG === 'th' ? 'en' : 'th');
}

function currentView() {
  var active = $('.tab.is-active');
  return active ? active.dataset.view : 'form';
}

function rebuildLocalizedUi() {
  var header = readHeader();
  var rows = STATE.rows.slice();
  var fuelRows = STATE.fuelRows.slice();
  var wasReadonly = STATE.readonly;
  var signup = {};
  BOOT.registerFields.forEach(function(f) {
    var n = $('#s_' + f.key);
    if (n) signup[f.key] = n.value;
  });

  renderShell();
  buildAuthScreens();
  buildRegisterFields();
  buildHeaderFields();
  buildTableHead();
  buildSummaryCards();

  writeHeader(header);
  BOOT.registerFields.forEach(function(f) {
    var n = $('#s_' + f.key);
    if (n && signup[f.key] !== undefined) n.value = signup[f.key];
  });

  $('#itemBody').innerHTML = '';
  $('#fuelBody').innerHTML = '';
  STATE.rows = [];
  STATE.fuelRows = [];
  rows.forEach(function(r) {
    addRow(r, true);
  });
  fuelRows.forEach(function(r) {
    addFuelRow(r, true);
  });
  if (!STATE.rows.length) addRow(null, true);
  if (!STATE.fuelRows.length) addFuelRow(null, true);
  if (wasReadonly) setReadonly(true);
  recalcTotals();

  if (ME) {
    applyIdentity();
    $('#pwHint').textContent = t('at_least_pre') + BOOT.cfg.minPasswordLen + t('suffix_chars');
  }

  if (STATE.claimId) updateBadge(STATE.status, STATE.claimId); else updateBadge('', t('badge_new'));
  renderFlowbar(STATE.status);

  if (REVIEW.claimId && REVIEW.claim && REVIEW.res) renderReview(REVIEW.res);

  var view = currentView();
  if (view === 'list') refreshList();
  if (view === 'inbox') refreshInbox();
  if (view === 'admin') refreshAdmin();
}

function getToken() {
  try {
    return localStorage.getItem(TOKEN_KEY) || '';
  } catch (e) {
    return TOKEN_MEM;
  }
}

function setToken(t) {
  TOKEN_MEM = t || '';
  try {
    if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}
}

var TOKEN_MEM = '';

var PUBLIC_FNS = [ 'login', 'logout', 'selfRegister', 'requestPasswordReset', 'validateResetToken', 'resetPasswordWithToken' ];

function call(fn, args, msg) {
  var payload = (args || []).slice();
  if (PUBLIC_FNS.indexOf(fn) < 0) payload.unshift(getToken());
  return new Promise(function(resolve, reject) {
    if (msg) showOverlay(msg);
    google.script.run.withSuccessHandler(function(res) {
      hideOverlay();
      if (res && res.ok === false && res.authRequired) {
        handleSessionExpired();
        resolve(res);
        return;
      }
      resolve(res);
    }).withFailureHandler(function(err) {
      hideOverlay();
      if (err && String(err.message || err).indexOf('AUTH_REQUIRED') >= 0) {
        handleSessionExpired();
      }
      reject(err);
    })[fn].apply(null, payload);
  });
}

function handleSessionExpired() {
  setToken('');
  ME = null;
  showAuth('login');
  toast(t('err_session_expired'), 'err');
}

function swalReady() {
  return typeof Swal !== 'undefined';
}

function swalBase() {
  var cs = getComputedStyle(document.documentElement);
  function v(name, dflt) {
    return (cs.getPropertyValue(name) || '').trim() || dflt;
  }
  return {
    bg: v('--bg-card', '#ffffff'),
    fg: v('--text-main', '#0f172a'),
    brand: v('--brand', '#2563eb'),
    bad: v('--bad', '#dc2626'),
    muted: v('--text-muted', '#64748b')
  };
}

function showOverlay(msg) {
  if (!swalReady()) {
    $('#overlayMsg').textContent = msg || t('busy_generic');
    $('#overlay').hidden = false;
    return;
  }
  var b = swalBase();
  Swal.fire({
    title: msg || t('busy_generic'),
    background: b.bg,
    color: b.fg,
    allowOutsideClick: false,
    allowEscapeKey: false,
    showConfirmButton: false,
    heightAuto: false,
    didOpen: function() {
      Swal.showLoading();
    }
  });
}

function hideOverlay() {
  $('#overlay').hidden = true;
  if (swalReady() && Swal.isVisible() && Swal.getTimerLeft() === undefined) Swal.close();
}

var toastTimer = null;

function toast(msg, kind) {
  if (!swalReady()) {
    var n = $('#toast');
    n.textContent = msg;
    n.className = 'toast ' + (kind || '');
    n.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      n.hidden = true;
    }, 4e3);
    return;
  }
  var b = swalBase();
  Swal.fire({
    toast: true,
    position: 'top-end',
    icon: kind === 'err' ? 'error' : kind === 'ok' ? 'success' : 'info',
    title: msg,
    background: b.bg,
    color: b.fg,
    showConfirmButton: false,
    timer: kind === 'err' ? 5e3 : 3e3,
    timerProgressBar: true,
    heightAuto: false
  });
}

function failLoad(err) {
  var msg = err && (err.message || err.toString ? err.toString() : String(err)) || String(err);
  alertErrors([ String(msg) ], t('err_load_failed'));
}

function alertErrors(list, title) {
  if (!swalReady() || !list || !list.length) return;
  var b = swalBase();
  Swal.fire({
    icon: 'error',
    title: title || t('err_incomplete'),

function askText(opts) {
  opts = opts || {};
  if (!swalReady()) return askTextFallback_(opts);
  var b = swalBase();
  var cfg = {
    title: opts.title || t('confirm_title'),
    text: opts.desc || '',
    icon: opts.icon || (opts.danger ? 'warning' : 'question'),
    background: b.bg,
    color: b.fg,
    showCancelButton: true,
    reverseButtons: true,
    heightAuto: false,
    buttonsStyling: true,
    confirmButtonText: opts.okText || t('act_confirm'),
    cancelButtonText: t('act_cancel'),
    confirmButtonColor: opts.danger ? b.bad : b.brand,
    cancelButtonColor: b.muted
  };
  if (!opts.noInput) {
    cfg.input = 'textarea';
    cfg.inputValue = opts.value || '';
    cfg.inputPlaceholder = opts.placeholder || '';
    cfg.inputAttributes = {
      rows: '3'
    };
    if (opts.required) cfg.inputValidator = function(v) {
      if (!v || !String(v).trim()) return t('err_field_required');
    };
  }
  return Swal.fire(cfg).then(function(r) {
    if (!r.isConfirmed) return null;
    return opts.noInput ? true : String(r.value == null ? '' : r.value).trim();
  });
}

function askTextFallback_(opts) {
  return new Promise(function(resolve) {
    var modal = $('#modal');
    $('#modalTitle').textContent = opts.title || t('confirm_title');
    $('#modalDesc').textContent = opts.desc || '';
    var input = $('#modalInput');
    input.value = opts.value || '';
    input.placeholder = opts.placeholder || '';
    input.hidden = opts.noInput === true;
    $('#modalOk').textContent = opts.okText || t('act_confirm');
    modal.hidden = false;
    setTimeout(function() {
      (opts.noInput ? $('#modalOk') : input).focus();
    }, 40);
    function done(value) {
      modal.hidden = true;
      $('#modalOk').removeEventListener('click', onOk);
      $('#modalCancel').removeEventListener('click', onCancel);
      document.removeEventListener('keydown', onKey);
      resolve(value);
    }
    function onOk() {
      var v = input.hidden ? '' : input.value.trim();
      if (opts.required && !v) {
        input.classList.add('is-invalid');
        return;
      }
      done(v === '' && !input.hidden ? '' : input.hidden ? true : v);
    }
    function onCancel() {
      done(null);
    }
    function onKey(e) {
      if (e.key === 'Escape') onCancel();
    }
    $('#modalOk').addEventListener('click', onOk);
    $('#modalCancel').addEventListener('click', onCancel);
    document.addEventListener('keydown', onKey);
  });
}

function buildProfileField(f, prefix) {
  var id = prefix + f.key;

  label.appendChild(el('span', {
    class: 'en',
    text: '/ ' + (LANG === 'en' ? f.th : f.en)
  }));
  if (f.required) label.appendChild(el('span', {
    class: 'req',
    text: ' *'
  }));
  var input;
  var list = f.master && BOOT.master[f.master] ? BOOT.master[f.master] : null;
  if (f.type === 'select') {
    input = el('select', {
      id: id
    });
    input.appendChild(el('option', {
      value: '',
      text: t('opt_none')
    }));
    (list || f.options || []).forEach(function(o) {
      input.appendChild(el('option', {
        value: o,
        text: o
      }));
    });
  } else if (list && list.length) {
    input = el('input', {
      type: 'text',
      id: id,
      list: id + '_dl',
      autocomplete: 'off'
    });
  } else {
    input = el('input', {
      type: f.type === 'email' ? 'email' : 'text',
      id: id,
      autocomplete: 'off'
    });
  }
  input.addEventListener('input', function() {
    input.classList.remove('is-invalid');
  });
  var field = el('div', {
    class: 'field'
  }, [ label, input ]);
  if (list && list.length && f.type !== 'select') {
    field.appendChild(el('datalist', {
      id: id + '_dl'
    }, list.map(function(v) {
      return el('option', {
        value: v
      });
    })));
  }
  if (f.hint) field.appendChild(el('small', {
    class: 'fieldhint',
    text: f.hint
  }));
  return field;
}

function doSignup() {
  var payload = {
    email: $('#signupEmail').value.trim(),
    password: $('#signupPassword').value,
    confirmPassword: $('#signupConfirm').value
  };
  BOOT.registerFields.forEach(function(f) {
    payload[f.key] = ($('#s_' + f.key) || {}).value || '';
  });
  var errors = [];
  if (!payload.email) errors.push(t('err_need_email'));
  if (payload.password !== payload.confirmPassword) errors.push(t('err_pw_mismatch'));
  if ((payload.password || '').length < BOOT.cfg.minPasswordLen) {
    errors.push(t('err_pw_min_pre') + BOOT.cfg.minPasswordLen + t('suffix_chars'));
  }
  BOOT.registerFields.forEach(function(f) {
    var n = $('#s_' + f.key);
    var empty = String(payload[f.key] || '').trim() === '';
    if (n) n.classList.toggle('is-invalid', f.required && empty);
    if (f.required && empty) errors.push(t('err_required_pre') + '"' + L(f) + '"');
  });
  if (errors.length) {
    showErrors(errors, '#authErrors');
    return;
  }
  call('selfRegister', [ payload ], t('busy_signup')).then(function(res) {
    if (!res.ok) {
      showErrors(res.errors || [ res.error ], '#authErrors');
      return;
    }
    if (res.token) {
      setToken(res.token);
      return refreshIdentityThenEnter();
    }
    showAuth('login');
    $('#loginEmail').value = payload.email;
    showNotice(res.message);
  }).catch(function(err) {
    showErrors([ t('err_pre') + (err.message || err) ], '#authErrors');
  });
}

function expenseTypes() {
  return BOOT.itemFields.filter(function(f) {
    return f.amount;
  });
}

function claimableTypes() {
  return BOOT.itemFields.filter(function(f) {
    return f.amount && !f.fleetCard;
  });
}

function expenseTypeByKey(key) {
  var hit = expenseTypes().filter(function(f) {
    return f.key === key;
  });
  return hit.length ? hit[0] : null;
}

function filledTypeKeys(row) {
  return CLAIM_KEYS.filter(function(k) {
    return num(row[k]) !== 0;
  });
}

function isFuelItem(row) {
  return num(row[FUEL_KEY]) !== 0 || num(row.liter) !== 0;
}

function collapseFuelRow(row) {
  var r = Object.assign({}, row);
  r.expenseType = FUEL_KEY;
  r.amount = num(row[FUEL_KEY]);
  r.liter = num(row.liter);
  r.multiType = false;
  return r;
}

function expandFuelRow(row) {
  var r = Object.assign({}, row);
  AMOUNT_KEYS.forEach(function(k) {
    r[k] = '';
  });
  r[FUEL_KEY] = num(row.amount);
  r.liter = num(row.liter);
  delete r.expenseType;
  delete r.amount;
  delete r.multiType;
  return r;
}

function rowAmount(row) {
  if (row.multiType) {
    return CLAIM_KEYS.reduce(function(s, k) {
      return s + num(row[k]);
    }, 0);
  }
  return num(row.amount);
}

function collapseRow(row) {
  var keys = filledTypeKeys(row);
  var r = Object.assign({}, row);
  if (keys.length === 1) {
    r.expenseType = keys[0];
    r.amount = num(row[keys[0]]);
    r.multiType = false;
  } else if (keys.length === 0) {
    r.expenseType = row.expenseType || '';
    r.amount = 0;
    r.multiType = false;
  } else {
    r.expenseType = '';
    r.amount = CLAIM_KEYS.reduce(function(s, k) {
      return s + num(row[k]);
    }, 0);
    r.multiType = true;
  }
  return r;
}

function expandRow(row) {
  var r = Object.assign({}, row);
  if (r.multiType) {
    delete r.expenseType;
    delete r.amount;
    delete r.multiType;
    return r;
  }
  AMOUNT_KEYS.forEach(function(k) {
    if (k !== FUEL_KEY) r[k] = '';
  });
  if (r.expenseType) r[r.expenseType] = num(r.amount);
  delete r.expenseType;
  delete r.amount;
  delete r.multiType;
  return r;
}

var GRIDS = {
  exp: {
    kind: 'exp',
    rowsKey: 'rows',
    body: '#itemBody',
    head: '#headRow',
    foot: '#footRow',
    counter: '#rowCounter',
    totalId: 'ft_total'
  },
  fuel: {
    kind: 'fuel',
    rowsKey: 'fuelRows',
    body: '#fuelBody',
    head: '#fuelHeadRow',
    foot: '#fuelFootRow',
    counter: '#fuelCounter',
    totalId: 'ft_fuel_total'
  }
};

function gridRows(grid) {
  return STATE[grid.rowsKey];
}

function gridOf(tr) {
  return tr && tr.parentNode && tr.parentNode.id === 'fuelBody' ? GRIDS.fuel : GRIDS.exp;
}

function usedRowCount() {
  return STATE.rows.length + STATE.fuelRows.length;
}

function gridColumns(grid) {
  var cols = [
    { main: 'No.', cls: 'c-no' },
    { main: t('col_date'), sub: 'Date', cls: 'c-date' },
    { main: t('col_receipt'), sub: 'Receipt No.', cls: 'c-receiptNo' },
    { main: t('col_description'), sub: 'Description', cls: 'c-description' },
    { main: t('col_dept'), sub: 'Support Div.', cls: 'c-supportDiv' }
  ];
  if (grid.kind === 'fuel') cols.push({ main: t('col_liter'), sub: 'Liter', cls: 'c-liter' });
  else cols.push({ main: t('col_type'), sub: 'Expense Type', cls: 'c-type' });
  cols.push({ main: t('col_amount'), sub: 'Amount', cls: 'c-amount' });
  cols.push({ main: '', cls: 'c-act' });
  return cols;
}

function buildOneHead(grid) {
  var headRow = $(grid.head);
  headRow.innerHTML = '';
  gridColumns(grid).forEach(function(c) {
    var th = el('th', { class: c.cls });
    th.appendChild(document.createTextNode(c.main));
    if (c.sub && LANG !== 'en') th.appendChild(el('small', { text: c.sub }));
    headRow.appendChild(th);
  });

  var foot = $(grid.foot);
  foot.innerHTML = '';
  foot.appendChild(el('td', { class: 'lbl', colspan: '6', text: grid.kind === 'fuel' ? t('fuel_subtotal') : t('grand_total') }));
  foot.appendChild(el('td', { class: 'c-amount', id: grid.totalId, text: '0.00' }));
  foot.appendChild(el('td', { class: 'c-act' }));
}

function buildTableHead() {
  buildOneHead(GRIDS.exp);
  buildOneHead(GRIDS.fuel);
  $('#gridHint').textContent = t('grid_hint');
  $('#fuelHint').textContent = t('fuel_hint');
}

function escapeText(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function findGroup(key) {
  for (var i = 0; i < BOOT.groups.length; i++) if (BOOT.groups[i].key === key) return BOOT.groups[i];
  return null;
}

function defaultSupportDiv() {
  var opts = supportDivOptions();
  var mine = ME && ME.profile && ME.profile.defaultSupportDiv;
  if (mine && opts.indexOf(mine) >= 0) return mine;
  return opts.length ? opts[0] : '';
}

function blankRow(grid) {
  var r = {};
  BOOT.itemFields.forEach(function(f) {
    r[f.key] = '';
  });
  r.supportDiv = defaultSupportDiv();
  r.expenseType = grid.kind === 'fuel' ? FUEL_KEY : '';
  r.amount = '';
  r.multiType = false;
  return r;
}

function addRowTo(grid, data, silent) {
  if (usedRowCount() >= BOOT.cfg.maxRows) {
    if (!silent) toast(t('err_max_rows_pre') + BOOT.cfg.maxRows + t('suffix_rows'), 'err');
    return null;
  }
  var row = Object.assign(blankRow(grid), data || {});
  if (grid.kind === 'fuel') row.expenseType = FUEL_KEY;
  gridRows(grid).push(row);
  var tr = buildRowEl(grid, row, gridRows(grid).length);
  $(grid.body).appendChild(tr);
  if (STATE.readonly) {
    $$('input, select', tr).forEach(function(n) {
      n.disabled = true;
    });
  }
  renumber();
  return tr;
}

function addRow(data, silent) {
  return addRowTo(GRIDS.exp, data, silent);
}

function addFuelRow(data, silent) {
  return addRowTo(GRIDS.fuel, data, silent);
}

function supportDivOptions() {
  return BOOT.master.supportDivs && BOOT.master.supportDivs.length ? BOOT.master.supportDivs : [ 'BB', 'BP', 'TRC' ];
}

function buildTypeSelect(row) {
  var sel = el('select', { class: 'typesel', title: t('col_type') });
  sel.appendChild(el('option', { value: '', text: t('opt_pick_type') }));

  BOOT.groups.forEach(function(g) {
    var inGroup = claimableTypes().filter(function(f) {
      return f.groupKey === g.key;
    });
    if (!inGroup.length) return;
    var og = el('optgroup', { label: L(g) + (g.account ? ' · ' + g.account : '') });
    inGroup.forEach(function(f) {
      og.appendChild(el('option', { value: f.key, text: L(f) }));
    });
    sel.appendChild(og);
  });

  if (row.multiType) {
    sel.appendChild(el('option', { value: '__multi', text: t('opt_multitype') }));
    sel.value = '__multi';
  } else {
    sel.value = row.expenseType || '';
  }
  return sel;
}

function buildRowEl(grid, row, index) {
  var tr = el('tr');
  tr.appendChild(el('td', { class: 'c-no', text: String(index) }));

  function cell(cls, input) {
    var td = el('td', { class: cls });
    td.appendChild(input);
    tr.appendChild(td);
    return input;
  }

  var dateInput = cell('c-date', el('input', { type: 'date', title: t('col_date') }));
  var receiptInput = cell('c-receiptNo', el('input', { type: 'text', title: t('col_receipt'), autocomplete: 'off' }));
  var descInput = cell('c-description', el('input', { type: 'text', title: t('col_description'), autocomplete: 'off' }));

  var divSel = el('select', { title: t('tip_support_div') });
  divSel.appendChild(el('option', { value: '', text: '—' }));
  supportDivOptions().forEach(function(o) {
    divSel.appendChild(el('option', { value: o, text: o }));
  });
  cell('c-supportDiv', divSel);

  var fields = [ dateInput, receiptInput, descInput, divSel ];
  var typeSel = null;
  var literInput = null;

  if (grid.kind === 'fuel') {
    literInput = cell('c-liter', el('input', { type: 'number', step: '0.01', min: '0', placeholder: '0.00', title: t('col_liter') }));
    literInput.dataset.key = 'liter';
    literInput.value = row.liter === '' || row.liter == null ? '' : row.liter;
    fields.push(literInput);
  } else {
    typeSel = cell('c-type', buildTypeSelect(row));
    typeSel.dataset.key = 'expenseType';
    fields.push(typeSel);
  }

  var amountInput = cell('c-amount', el('input', { type: 'number', step: '0.01', min: '0', placeholder: '0.00', title: t('col_amount') }));

  dateInput.dataset.key = 'date';
  receiptInput.dataset.key = 'receiptNo';
  descInput.dataset.key = 'description';
  divSel.dataset.key = 'supportDiv';
  amountInput.dataset.key = 'amount';

  dateInput.value = row.date || '';
  receiptInput.value = row.receiptNo || '';
  descInput.value = row.description || '';
  divSel.value = row.supportDiv || '';
  amountInput.value = row.amount === '' || row.amount == null ? '' : row.amount;

  fields.push(amountInput);
  fields.forEach(function(n) {
    n.addEventListener('input', onCellInput);
    n.addEventListener('change', onCellInput);
    n.addEventListener('keydown', onCellKeydown);
  });
  amountInput.addEventListener('blur', onAmountBlur);
  if (literInput) literInput.addEventListener('blur', onAmountBlur);

  if (row.multiType && typeSel) {
    typeSel.disabled = true;
    amountInput.disabled = true;
    typeSel.title = t('tip_multitype');
  }

  var del = el('button', { class: 'rowdel', type: 'button', title: t('tip_delete_row'), text: '×' });
  del.addEventListener('click', function() {
    removeRow(tr);
  });
  tr.appendChild(el('td', { class: 'c-act' }, [ del ]));

  applyRowType(grid, tr, row);
  return tr;
}

function applyRowType(grid, tr, row) {
  var key = grid.kind === 'fuel' ? FUEL_KEY : row.expenseType;
  var g = key ? findGroup((expenseTypeByKey(key) || {}).groupKey) : null;
  tr.style.borderLeft = g ? '4px solid ' + g.color : '4px solid transparent';
  tr.classList.toggle('is-filled', !isEmptyRow(grid, row));
}

function onCellInput(e) {
  var tr = e.target.closest('tr');
  var grid = gridOf(tr);
  var idx = rowIndex(grid, tr);
  if (idx < 0) return;

  var key = e.target.dataset.key;
  var row = gridRows(grid)[idx];

  if (key === 'expenseType' && e.target.value === '__multi') return;
  row[key] = e.target.value;
  if (key === 'expenseType') row.multiType = false;

  applyRowType(grid, tr, row);
  recalcTotals();

  if (idx === gridRows(grid).length - 1 && !isEmptyRow(grid, row)) {
    if (usedRowCount() < BOOT.cfg.maxRows) addRowTo(grid, null, true);
  }
}

function onAmountBlur(e) {
  var v = e.target.value;
  if (v === '') return;
  var n = num(v);
  if (n < 0) {
    e.target.value = '';
    toast(t('err_amount_negative'), 'err');
  } else e.target.value = n.toFixed(2);
  onCellInput(e);
}

function onCellKeydown(e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  var tr = e.target.closest('tr');
  var grid = gridOf(tr);
  var next = tr.nextElementSibling;
  if (!next) {
    addRowTo(grid, null, true);
    next = tr.nextElementSibling;
  }
  if (!next) return;
  var target = next.querySelector('[data-key="' + e.target.dataset.key + '"]');
  if (target) {
    target.focus();
    if (target.select) target.select();
  }
}

function rowIndex(grid, tr) {
  return Array.prototype.indexOf.call($(grid.body).children, tr);
}

function isEmptyRow(grid, row) {
  if (num(row.amount) !== 0) return false;
  if (grid.kind === 'fuel') {
    if (num(row.liter) !== 0) return false;
    return ![ 'date', 'receiptNo', 'description' ].some(function(k) {
      return String(row[k] || '').trim() !== '';
    });
  }
  if (row.multiType) return false;
  return ![ 'date', 'receiptNo', 'description', 'expenseType' ].some(function(k) {
    return String(row[k] || '').trim() !== '';
  });
}

function filledRows(grid) {
  return gridRows(grid).filter(function(r) {
    return !isEmptyRow(grid, r);
  });
}

function removeRow(tr) {
  if (STATE.readonly) return;
  var grid = gridOf(tr);
  var idx = rowIndex(grid, tr);
  if (idx < 0) return;
  gridRows(grid).splice(idx, 1);
  tr.remove();
  if (!gridRows(grid).length) addRowTo(grid, null, true);
  renumber();
  recalcTotals();
}

function renumber() {
  [ GRIDS.exp, GRIDS.fuel ].forEach(function(grid) {
    $$(grid.body + ' tr').forEach(function(tr, i) {
      tr.querySelector('td.c-no').textContent = String(i + 1);
    });
    $(grid.counter).textContent = filledRows(grid).length + ' / ' + BOOT.cfg.maxRows + t('suffix_rows');
  });
}

function recalcTotals() {
  var sums = {};
  CLAIM_KEYS.forEach(function(k) {
    sums[k] = 0;
  });

  STATE.rows.forEach(function(r) {
    if (r.multiType) {
      CLAIM_KEYS.forEach(function(k) {
        sums[k] += num(r[k]);
      });
    } else if (r.expenseType && r.expenseType !== FUEL_KEY) {
      sums[r.expenseType] += num(r.amount);
    }
  });

  var grand = CLAIM_KEYS.reduce(function(s, k) {
    return s + sums[k];
  }, 0);

  var fuelAmount = 0;
  var fuelLiter = 0;
  STATE.fuelRows.forEach(function(r) {
    fuelAmount += num(r.amount);
    fuelLiter += num(r.liter);
  });

  var totalCell = document.getElementById('ft_total');
  if (totalCell) totalCell.textContent = money(grand);
  var fuelCell = document.getElementById('ft_fuel_total');
  if (fuelCell) fuelCell.textContent = money(fuelAmount);
  $('#grandTotal').textContent = money(grand);
  $('#fuelTotalOut').textContent = money(fuelAmount);
  $('#fuelLiterOut').textContent = money(fuelLiter);
  var fuelCard = document.getElementById('sum_fuel');
  if (fuelCard) fuelCard.textContent = money(fuelAmount);
  var fuelLiterCard = document.getElementById('sum_fuel_liter');
  if (fuelLiterCard) fuelLiterCard.textContent = money(fuelLiter) + ' ' + t('unit_liter');
  $('#fuelMemo').hidden = fuelAmount === 0 && fuelLiter === 0;

  BOOT.groups.forEach(function(g) {
    var keys = claimableTypes().filter(function(f) {
      return f.groupKey === g.key;
    }).map(function(f) {
      return f.key;
    });
    if (!keys.length) return;
    var v = keys.reduce(function(s, k) {
      return s + sums[k];
    }, 0);
    var node = document.getElementById('sum_' + g.key);
    if (node) node.textContent = money(v);
  });

  renumber();
}

function buildSummaryCards() {
  var wrap = $('#summary');
  wrap.innerHTML = '';
  BOOT.groups.forEach(function(g) {
    var has = BOOT.itemFields.some(function(f) {
      return f.groupKey === g.key && f.amount;
    });
    if (!has) return;
    var card = el('div', {
      class: 'sum-card'
    }, [ el('h4', {
      html: '<i class="swatch" style="background:' + g.color + '"></i>' + escapeText(L(g))
    }), el('div', {
      class: 'acct',
      text: g.account ? t('acct_pre') + g.account : '—'
    }), el('div', {
      class: 'val',
      id: 'sum_' + g.key,
      text: '0.00'
    }) ]);
    wrap.appendChild(card);
  });

  var fuelField = BOOT.itemFields.filter(function(f) {
    return f.key === FUEL_KEY;
  })[0];
  if (!fuelField) return;
  var fuelGroup = findGroup(fuelField.groupKey);
  wrap.appendChild(el('div', {
    class: 'sum-card sum-card--fuel'
  }, [ el('h4', {
    html: '<i class="swatch swatch--fuel"></i>' + escapeText(t('ttl_fuel'))
  }), el('div', {
    class: 'acct',
    text: (fuelGroup && fuelGroup.account ? t('acct_pre') + fuelGroup.account + ' · ' : '') + t('lbl_not_reimbursed')
  }), el('div', {
    class: 'val',
    id: 'sum_fuel',
    text: '0.00'
  }), el('div', {
    class: 'acct',
    id: 'sum_fuel_liter',
    text: '0.00 ' + t('unit_liter')
  }) ]));
}

function renderFlowbar(status) {
  var bar = $('#flowbar');
  if (!status) {
    bar.hidden = true;
    return;
  }
  var order = [ 'Draft', 'Submitted', 'Checked', 'Approved' ];
  if (BOOT.cfg.requirePaymentStep) order.push('Paid');
  var current = order.indexOf(status);
  var rejected = status === 'Rejected';
  bar.innerHTML = '';
  bar.hidden = false;
  var labels = [ {
    s: 'Draft',
    t: t('stage_prepare'),
    who: 'Sale'
  }, {
    s: 'Submitted',
    t: t('stage_check'),
    who: 'Admin'
  }, {
    s: 'Checked',
    t: t('act_approve'),
    who: 'Manager'
  }, {
    s: 'Approved',
    t: t('st_Approved'),
    who: ''
  } ];
  if (status === 'Paid') labels.push({
    s: 'Paid',
    t: t('st_Paid'),
    who: 'Finance'
  });
  labels.forEach(function(l, i) {
    var state = 'todo';
    if (rejected && i <= 1) state = i === 0 ? 'done' : 'rejected'; else if (current >= 0 && i < current) state = 'done'; else if (current === i) state = 'current';
    if (status === 'Paid') state = 'done';
    bar.appendChild(el('div', {
      class: 'step step--' + state
    }, [ el('span', {
      class: 'step__dot',
      text: state === 'done' ? '✓' : state === 'rejected' ? '!' : String(i + 1)
    }), el('span', {
      class: 'step__label',
      text: l.t
    }), l.who ? el('span', {
      class: 'step__who',
      text: l.who
    }) : null ]));
    if (i < labels.length - 1) bar.appendChild(el('div', {
      class: 'step__line'
    }));
  });
}

function newClaim() {
  STATE = {
    claimId: '',
    status: 'Draft',
    rows: [],
    fuelRows: [],
    perms: {
      canEdit: true,
      canSubmit: true,
      isOwner: true
    },
    readonly: false
  };
  writeHeader(null);
  $('#note').value = '';
  $('#itemBody').innerHTML = '';
  $('#fuelBody').innerHTML = '';
  showErrors(null);
  $('#historyCard').hidden = true;
  $('#rejectBanner').hidden = true;
  $('#lockBanner').hidden = true;
  var now = new Date;
  $('#h_yearMonth').value = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  $('#h_claimDate').value = now.toISOString().slice(0, 10);
  var p = ME.profile;
  if (p) {
    $('#h_employee').value = p.name || '';
    $('#h_division').value = p.division || '';
    $('#h_jobTitle').value = p.jobTitle || '';
  } else {
    $('#h_employee').value = ME.name || '';
  }
  for (var i = 0; i < 5; i++) addRow(null, true);
  for (var j = 0; j < 2; j++) addFuelRow(null, true);
  setReadonly(false);
  updateBadge('', t('badge_new'));
  $('#btnPdf').disabled = true;
  renderFlowbar('Draft');
  applyPermissions({
    canEdit: true,
    canSubmit: true,
    isOwner: true
  });
  recalcTotals();
  switchView('form');
}

function loadClaim(claimId) {
  return call('getClaim', [ claimId ], t('busy_load_claim')).then(function(res) {
    if (!res.ok) {
      toast(res.errors.join(' '), 'err');
      return;
    }
    var c = res.claim;
    STATE.claimId = c.claimId;
    STATE.status = c.status;
    STATE.perms = res.permissions || {};
    STATE.rows = [];
    STATE.fuelRows = [];
    $('#itemBody').innerHTML = '';
    $('#fuelBody').innerHTML = '';
    showErrors(null);
    writeHeader(c);
    $('#note').value = c.note || '';
    res.items.forEach(function(it) {
      if (isFuelItem(it)) addFuelRow(collapseFuelRow(it), true); else addRow(collapseRow(it), true);
    });
    var editable = !!STATE.perms.canEdit;
    if (editable && usedRowCount() < BOOT.cfg.maxRows) {
      if (!STATE.rows.length) addRow(null, true);
      if (!STATE.fuelRows.length) addFuelRow(null, true);
    }
    setReadonly(!editable);
    updateBadge(c.status, c.claimId + (Number(c.revision) ? ' · rev ' + c.revision : ''));
    $('#btnPdf').disabled = false;
    renderFlowbar(c.status);
    renderRejectBanner(c);
    renderLockBanner(c, editable);
    renderHistory(res.history, '#historyList', '#historyCard');
    applyPermissions(STATE.perms);
    recalcTotals();
    switchView('form');
  }).catch(failLoad);
}

function renderRejectBanner(c) {
  var b = $('#rejectBanner');
  if (c.status !== 'Rejected' || !c.rejectReason) {
    b.hidden = true;
    return;
  }
  b.innerHTML = '';
  b.appendChild(el('strong', {
    text: t('rejected_at_pre') + (c.rejectStage || '-')
  }));
  b.appendChild(el('p', {
    text: c.rejectReason
  }));
  b.appendChild(el('small', {
    text: t('by_pre') + (c.rejectedBy || '-') + t('sep_on') + (c.rejectedAt || '-') + t('reject_edit_note')
  }));
  b.hidden = false;
}

function renderLockBanner(c, editable) {
  var b = $('#lockBanner');
  if (editable) {
    b.hidden = true;
    return;
  }
  b.textContent = t('claim_status_pre') + statusLabel(c.status) + t('lock_readonly_suffix');
  b.hidden = false;
}

function renderHistory(rows, listSel, cardSel) {
  var ul = $(listSel);
  ul.innerHTML = '';
  if (!rows || !rows.length) {
    $(cardSel).hidden = true;
    return;
  }
  var actionTh = {
    Submit: t('act_send_to_check'),
    Resubmit: t('act_resubmit'),
    Check: t('act_check_pass'),
    Approve: t('act_approve'),
    Reject: t('act_reject'),
    Pay: t('act_mark_paid'),
    Edit: t('act_edit_items'),
    Delete: t('title_delete_claim')
  };
  rows.slice().reverse().forEach(function(r) {
    var li = el('li', {
      class: 'tl tl--' + String(r.action).toLowerCase()
    }, [ el('span', {
      class: 'tl__act',
      text: actionTh[r.action] || r.action
    }), el('span', {
      class: 'tl__who',
      text: r.actor + (r.role ? ' (' + r.role + ')' : '')
    }), el('span', {
      class: 'tl__at',
      text: r.at
    }), r.comment ? el('p', {
      class: 'tl__note',
      text: r.comment
    }) : null ]);
    ul.appendChild(li);
  });
  $(cardSel).hidden = false;
}

function setReadonly(on) {
  STATE.readonly = !!on;
  $$('#view-form input, #view-form select, #view-form textarea').forEach(function(n) {
    n.disabled = !!on;
  });
  $('#btnAddRow').disabled = !!on;
  $('#btnAddFuel').disabled = !!on;
  $('#btnClearEmpty').disabled = !!on;
}

function applyPermissions(p) {
  p = p || {};
  $('#btnDraft').hidden = !p.canEdit;
  $('#btnSubmit').hidden = !p.canSubmit;
  $('#btnCheck').hidden = !p.canCheck;
  $('#btnApprove').hidden = !p.canApprove;
  $('#btnReject').hidden = !p.canReject;
  $('#btnPay').hidden = !p.canPay;
  $('#btnSubmit').textContent = STATE.status === 'Rejected' ? t('title_resubmit') : t('act_submit_admin');
}

function updateBadge(status, text) {
  var b = $('#claimIdBadge');
  b.textContent = text + (status ? ' · ' + statusLabel(status) : '');
  b.className = badgeClass(status || 'new');
  b.hidden = !!(ME && !ME.canClaim);
}

function collectPayload() {
  return {
    claimId: STATE.claimId,
    header: readHeader(),
    note: $('#note').value,
    items: filledRows(GRIDS.exp).map(expandRow).concat(filledRows(GRIDS.fuel).map(expandFuelRow))
  };
}

function saveDraft() {
  if (STATE.readonly) return;
  showErrors(null);
  call('saveClaim', [ collectPayload() ], t('busy_saving')).then(function(res) {
    if (!res.ok) {
      showErrors(res.errors, null, t('err_save_failed'));
      return;
    }
    STATE.claimId = res.claimId;
    if (!STATE.status || STATE.status === 'Draft') STATE.status = res.status;
    updateBadge(STATE.status, res.claimId);
    $('#btnPdf').disabled = false;
    toast(res.message + ' (' + res.claimId + ')', 'ok');
  }).catch(function(err) {
    toast(t('err_pre') + (err.message || err), 'err');
  });
}

function submitClaim() {
  if (STATE.readonly) return;
  showErrors(null);
  var local = validateLocal();
  if (local.length) {
    showErrors(local, null, t('err_incomplete'));
    return;
  }
  var payload = collectPayload();
  askText({
    title: t('title_submit_admin'),
    desc: t('total_pre') + $('#grandTotal').textContent + ' ' + BOOT.cfg.currency + t('lock_flow_note'),

function validateLocal() {
  var errors = [];
  BOOT.headerFields.forEach(function(f) {
    var input = $('#h_' + f.key);
    var empty = String(input.value || '').trim() === '';
    input.classList.toggle('is-invalid', f.required && empty);
    if (f.required && empty) errors.push(t('err_required_pre') + '"' + L(f) + '"');
  });
  var items = filledRows(GRIDS.exp);
  var fuel = filledRows(GRIDS.fuel);
  if (!items.length && !fuel.length) errors.push(t('err_need_one_row'));
  items.forEach(function(r, i) {
    var n = i + 1;
    if (!String(r.date || '').trim()) errors.push(t('row_no_pre') + n + t('err_no_date'));
    if (!String(r.description || '').trim()) errors.push(t('row_no_pre') + n + t('err_no_desc'));
    if (!r.multiType && !r.expenseType) errors.push(t('row_no_pre') + n + t('err_no_type'));
    if (rowAmount(r) <= 0) errors.push(t('row_no_pre') + n + t('err_amount_positive'));
  });
  fuel.forEach(function(r, i) {
    var n = t('fuel_row_pre') + (i + 1);
    if (!String(r.date || '').trim()) errors.push(n + t('err_no_date'));
    if (num(r.liter) <= 0) errors.push(n + t('err_no_liter'));
    if (num(r.amount) <= 0) errors.push(n + t('err_amount_positive'));
  });
  return errors;
}

function doStageAction(fn, opts) {

    var comment = input === true ? '' : input;
    return call(fn, [ STATE.claimId || REVIEW.claimId, comment ], opts.busy || t('busy_working')).then(function(res) {
      if (!res.ok) {
        toast(res.errors.join(' '), 'err');
        showErrors(res.errors, opts.errorBox || '#errors');

      }
      toast(res.message, 'ok');
      if (opts.after) opts.after(res);
    });
  }).catch(function(err) {
    toast(t('err_pre') + (err.message || err), 'err');
  });
}

function renderReviewRows() {

    }));

    }));
    var totalTd = el('td', {
      class: 'num strong',
      text: money(it.rowTotal)
    });
    tr.appendChild(totalTd);
    var breakdownTd = el('td', {
      class: 'c-breakdown'
    });
    var breakdown = el('div', {
      class: 'breakdown'
    });
    breakdownTd.appendChild(breakdown);
    BOOT.itemFields.filter(function(f) {
      return f.amount;
    }).forEach(function(f) {
      var v = num(it[f.key]);
      if (!v) return;
      var g = findGroup(f.groupKey);
      var chip = el('span', {
        class: 'chip'
      }, [ el('em', {
        text: L(f)
      }), el('b', {
        text: money(v)
      }) ]);
      if (g) {
        chip.style.background = g.color;
        chip.style.color = '#1c2433';
        chip.style.borderColor = g.color;
      }
      if (REVIEW.editMode) {
        chip.innerHTML = '';
        chip.appendChild(el('em', {
          text: L(f)
        }));
        var inp = el('input', {
          type: 'number',
          step: '0.01',
          min: '0',
          class: 'chipinput'
        });
        inp.value = v;
        inp.addEventListener('change', function() {
          it[f.key] = num(inp.value);
          it.rowTotal = CLAIM_KEYS.reduce(function(s, k) {
            return s + num(it[k]);
          }, 0);
          totalTd.textContent = money(it.rowTotal);
          renderReviewFoot();
        });
        chip.appendChild(inp);
      }
      breakdown.appendChild(chip);
    });
    if (num(it.liter)) breakdown.appendChild(el('span', {
      class: 'chip chip--muted'
    }, [ el('em', {
      text: t('col_liter')
    }), el('b', {
      text: money(it.liter) + ' ' + t('unit_liter')
    }) ]));
    tr.appendChild(breakdownTd);
    var flagTd = el('td', {
      class: 'c-flag'
    });
    var btn = el('button', {
      type: 'button',
      class: 'flagbtn'
    });
    function paint() {
      var def = BOOT.reviewFlags.filter(function(f) {
        return f.key === (it.reviewFlag || '');
      })[0] || BOOT.reviewFlags[0];
      btn.textContent = def.icon + ' ' + L(def);
      btn.style.color = def.color;
      btn.style.borderColor = def.color;
      tr.className = 'rv-' + (it.reviewFlag || 'none');
    }
    if (REVIEW.perms.canCheck) {
      btn.addEventListener('click', function() {
        var keys = BOOT.reviewFlags.map(function(f) {
          return f.key;
        });
        var next = keys[(keys.indexOf(it.reviewFlag || '') + 1) % keys.length];
        it.reviewFlag = next;
        paint();
        renderReviewProgress();
      });
    } else {
      btn.disabled = true;
      btn.classList.add('flagbtn--static');
    }
    paint();
    flagTd.appendChild(btn);
    tr.appendChild(flagTd);
    var noteTd = el('td');
    if (REVIEW.perms.canCheck) {
      var note = el('input', {
        type: 'text',
        class: 'rvnote',
        placeholder: t('ph_reject_detail')
      });

      note.addEventListener('input', function() {
        it.reviewNote = note.value;
      });
      noteTd.appendChild(note);
    } else {
      noteTd.className = 'wrap';
      noteTd.textContent = it.reviewNote || '-';
    }
    tr.appendChild(noteTd);
    body.appendChild(tr);
  });

  renderReviewProgress();
}

function renderReviewProgress() {

    return it.reviewFlag;
  }).length;

  }).length;

  $('#rvBar').style.background = flagged ? '#b45309' : '#10794a';
  $('#rvProgress').textContent = t('reviewed_pre') + reviewed + ' / ' + total + t('suffix_items') + (flagged ? t('sep_flagged') + flagged : '');

      });
      res.roles.forEach(function(r) {
        roleSel.appendChild(el('option', {
          value: r,
          text: r
        }));
      });
      roleSel.value = u.role;
      roleTd.appendChild(roleSel);
      tr.appendChild(roleTd);
      var activeTd = el('td', {
        class: 'center'
      });
      var activeBox = el('input', {
        type: 'checkbox',
        class: 'chkbox'
      });
      activeBox.checked = u.active;
      activeTd.appendChild(activeBox);
      tr.appendChild(activeTd);
      tr.appendChild(el('td', {
        class: 'muted',
        text: u.lastLogin ? u.lastLogin.replace('T', ' ') : t('never_signed_in')
      }));
      var act = el('td', {
        class: 'nowrap'
      });
      var save = el('button', {
        class: 'btn btn--primary btn--sm',
        type: 'button',
        text: t('act_save')
      });
      save.addEventListener('click', function() {
        call('saveUser', [ u.email, {
          role: roleSel.value,
          active: activeBox.checked
        } ], t('busy_saving')).then(function(r) {
          toast(r.ok ? r.message : r.errors.join(' '), r.ok ? 'ok' : 'err');
          if (r.ok) refreshAdmin();
        });
      });
      act.appendChild(save);
      var reset = el('button', {
        class: 'btn btn--ghost btn--sm',
        type: 'button',
        text: t('act_set_pw')
      });
      reset.style.marginLeft = '6px';
      reset.addEventListener('click', function() {
        askText({
          title: t('act_reset_pw_for') + u.email,
          desc: t('warn_reset_pw'),
          placeholder: t('ph_new_pw_min_pre') + BOOT.cfg.minPasswordLen + t('suffix_chars'),
          required: true,
          okText: t('act_set_pw')
        }).then(function(pw) {
          if (pw === null) return;
          return call('adminResetPassword', [ u.email, pw ], t('busy_set_pw')).then(function(r) {
            toast(r.ok ? r.message : r.errors.join(' '), r.ok ? 'ok' : 'err');
          });
        });
      });
      act.appendChild(reset);
      tr.appendChild(act);
      body.appendChild(tr);
    });
  }).catch(failLoad);
}

function bindActions() {
  $$('.tab').forEach(function(n) {
    n.addEventListener('click', function() {
      if (!ME.registered && n.dataset.view !== 'register') {
        toast(t('err_register_first'), 'err');
        switchView('register');
        return;
      }
      switchView(n.dataset.view);
    });
  });
  $('#btnRegister').addEventListener('click', submitRegistration);
  $('#btnAddRow').addEventListener('click', function() {
    addRow();
  });
  $('#btnAddFuel').addEventListener('click', function() {
    addFuelRow();
  });
  $('#btnClearEmpty').addEventListener('click', function() {
    [ GRIDS.exp, GRIDS.fuel ].forEach(function(grid) {
      var kept = filledRows(grid);
      STATE[grid.rowsKey] = [];
      $(grid.body).innerHTML = '';
      kept.forEach(function(r) {
        addRowTo(grid, r, true);
      });
      addRowTo(grid, null, true);
    });
    recalcTotals();
    toast(t('msg_empty_rows_removed'));
  });
  $('#btnNew').addEventListener('click', function() {
    if (STATE.claimId || filledRows(GRIDS.exp).length || filledRows(GRIDS.fuel).length) {
      askText({
        title: t('title_new_claim'),
        desc: t('warn_unsaved'),
        noInput: true,
        okText: t('act_start_new')
      }).then(function(ok) {
        if (ok) newClaim();
      });
      return;
    }
    newClaim();
  });
  $('#btnDraft').addEventListener('click', saveDraft);
  $('#btnSubmit').addEventListener('click', submitClaim);
  $('#btnCheck').addEventListener('click', function() {
    doStageAction('checkClaim', {
      title: t('act_check_pass'),
      desc: t('title_forward_manager'),
      placeholder: t('ph_checker_comment'),
      okText: t('act_check_pass'),
      after: function() {
        loadClaim(STATE.claimId);
      }
    });
  });
  $('#btnApprove').addEventListener('click', function() {
    doStageAction('approveClaim', {
      title: t('title_approve_claim'),
      desc: t('total_pre') + $('#grandTotal').textContent + ' ' + BOOT.cfg.currency,
      placeholder: t('ph_approver_comment'),
      okText: t('act_approve'),
      after: function() {
        loadClaim(STATE.claimId);
      }
    });
  });
  $('#btnReject').addEventListener('click', function() {
    doStageAction('rejectClaim', {
      title: t('act_reject_for_edit'),
      desc: t('reject_note'),
      placeholder: t('title_reject_reason'),
      required: true,
      okText: t('act_reject'),
      after: function() {
        loadClaim(STATE.claimId);
      }
    });
  });
  $('#btnPay').addEventListener('click', function() {
    doStageAction('markPaid', {
      title: t('act_record_payment'),
      desc: t('claim_pre') + STATE.claimId,
      placeholder: t('ph_payment_ref'),
      okText: t('act_save'),
      after: function() {
        loadClaim(STATE.claimId);
      }
    });
  });
  $('#btnPdf').addEventListener('click', function() {
    exportPdfFor(STATE.claimId);
  });
  $('#btnGoInbox').addEventListener('click', function() {
    switchView('inbox');
  });
  $('#btnRvBack').addEventListener('click', function() {
    switchView('inbox');
  });
  $('#btnRvPdf').addEventListener('click', function() {
    exportPdfFor(REVIEW.claimId);
  });
  $('#rvEditMode').addEventListener('change', function() {
    REVIEW.editMode = this.checked;
    renderReviewRows();
    toast(REVIEW.editMode ? t('msg_edit_on') : t('msg_edit_off'));
  });
  $('#btnMarkAllOk').addEventListener('click', function() {
    REVIEW.items.forEach(function(it) {
      it.reviewFlag = 'ok';
    });
    renderReviewRows();
  });
  $('#btnClearMarks').addEventListener('click', function() {
    REVIEW.items.forEach(function(it) {
      it.reviewFlag = '';
      it.reviewNote = '';
    });
    renderReviewRows();
  });
  $('#btnRvSaveReview').addEventListener('click', function() {
    var chain = REVIEW.editMode ? saveReviewEdits() : Promise.resolve({
      ok: true
    });
    chain.then(function(res) {
      if (res && !res.ok) {
        showErrors(res.errors, '#rvErrors');
        return;
      }
      return saveReviewMarks(false);
    }).catch(function(err) {
      toast(t('err_pre') + (err.message || err), 'err');
    });
  });
  $('#btnRvPass').addEventListener('click', function() {
    askText({
      title: t('act_check_pass'),
      desc: t('msg_checked_forward'),
      value: $('#rvComment').value,
      placeholder: t('ph_review_summary'),
      okText: t('act_check_pass')
    }).then(function(comment) {
      if (comment === null) return;
      $('#rvComment').value = comment === true ? '' : comment;
      var chain = REVIEW.editMode ? saveReviewEdits() : Promise.resolve({
        ok: true
      });
      return chain.then(function(r) {
        if (r && !r.ok) throw new Error(r.errors.join(' '));
        return saveReviewMarks(true);
      }).then(function() {
        return call('checkClaim', [ REVIEW.claimId, $('#rvComment').value ], t('busy_forward'));
      }).then(function(res) {
        if (!res.ok) {
          showErrors(res.errors, '#rvErrors', t('err_forward_failed'));
          return;
        }
        toast(res.message, 'ok');
        REVIEW.claimId = '';
        switchView('inbox');
      });
    }).catch(function(err) {
      toast(t('err_pre') + (err.message || err), 'err');
    });
  });
  $('#btnRvApprove').addEventListener('click', function() {
    askText({
      title: t('title_approve_claim'),
      desc: t('claim_pre') + REVIEW.claimId,
      placeholder: t('ph_approver_comment'),
      okText: t('act_approve')
    }).then(function(comment) {
      if (comment === null) return;
      return call('approveClaim', [ REVIEW.claimId, comment === true ? '' : comment ], t('busy_approve')).then(function(res) {
        if (!res.ok) {
          showErrors(res.errors, '#rvErrors');
          return;
        }
        toast(res.message, 'ok');
        REVIEW.claimId = '';
        switchView('inbox');
      });
    });
  });
  $('#btnRvReject').addEventListener('click', function() {
    var flagged = REVIEW.items.filter(function(it) {
      return it.reviewFlag === 'flag';
    });
    var suggested = flagged.map(function(it) {
      return t('row_no_pre') + it.seq + ': ' + (it.reviewNote || t('st_Rejected'));
    }).join('\n');
    askText({
      title: t('act_reject_for_edit'),
      desc: t('reject_note_pre') + REVIEW.claimId + ')',
      value: suggested || $('#rvComment').value,
      placeholder: t('title_reject_reason'),
      required: true,
      okText: t('act_reject')
    }).then(function(reason) {
      if (reason === null) return;
      return saveReviewMarks(true).then(function() {
        return call('rejectClaim', [ REVIEW.claimId, reason ], t('busy_rejecting'));
      }).then(function(res) {
        if (!res.ok) {
          showErrors(res.errors, '#rvErrors');
          return;
        }
        toast(res.message, 'ok');
        REVIEW.claimId = '';
        switchView('inbox');
      });
    }).catch(function(err) {
      toast(t('err_pre') + (err.message || err), 'err');
    });
  });
  $('#btnRefresh').addEventListener('click', refreshList);
  $('#fMine').addEventListener('change', refreshList);
  $('#fStatus').addEventListener('change', refreshList);
  $('#fQuery').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') refreshList();
  });
  $('#btnInboxRefresh').addEventListener('click', refreshInbox);
  $('#btnAdminRefresh').addEventListener('click', refreshAdmin);
  $('#aStatus').addEventListener('change', refreshAdmin);
  $('#aRole').addEventListener('change', refreshAdmin);
  $('#aQuery').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') refreshAdmin();
  });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (!$('#view-form').hidden && !STATE.readonly) saveDraft();
    }
  });
  window.addEventListener('beforeunload', function(e) {
    if (!$('#view-form').hidden && !STATE.readonly && (filledRows(GRIDS.exp).length || filledRows(GRIDS.fuel).length)) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

function exportPdfFor(claimId) {
  if (!claimId) {
    toast(t('err_save_first'), 'err');
    return;
  }
  call('exportPdf', [ claimId ], t('busy_pdf')).then(function(res) {
    if (!res.ok) {
      toast(res.errors.join(' '), 'err');
      return;
    }
    toast(t('msg_pdf_done_pre') + res.name, 'ok');
    window.open(res.url, '_blank');
  });
}
</script>
