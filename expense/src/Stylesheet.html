<style>
:root {
  --font-sans: 'Plus Jakarta Sans', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Menlo, monospace;

  --bg-app: #f8fafc;
  --bg-card: #ffffff;
  --bg-card-hover: #f1f5f9;
  --bg-nav: #ffffff;
  --bg-topbar: #1e40af;
  --bg-input: #ffffff;
  --bg-table-header: #f8fafc;
  --bg-table-zebra: #fbfcfe;
  --bg-table-hover: #f1f5f9;
  --bg-modal-overlay: rgba(15, 23, 42, 0.65);
  --bg-subtle: #f1f5f9;

  --border: #e2e8f0;
  --border-subtle: #f1f5f9;
  --border-focus: #3b82f6;

  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  --text-topbar: #f8fafc;

  --brand: #2563eb;
  --brand-hover: #1d4ed8;
  --brand-light: #eff6ff;
  --brand-text: #1d4ed8;
  --brand-border: #bfdbfe;

  --ok: #059669;
  --ok-bg: #ecfdf5;
  --ok-text: #047857;
  --ok-border: #a7f3d0;

  --warn: #d97706;
  --warn-bg: #fffbeb;
  --warn-text: #b45309;
  --warn-border: #fde68a;

  --bad: #dc2626;
  --bad-bg: #fef2f2;
  --bad-text: #b91c1c;
  --bad-border: #fecaca;

  --info-bg: #eef2ff;
  --info-text: #3730a3;
  --info-border: #c7d2fe;

  --teal-bg: #ccfbf1;
  --teal-text: #115e59;

  --radius: 12px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
}

[data-theme="dark"] {
  --bg-app: #090d16;
  --bg-card: #131c2e;
  --bg-card-hover: #1c283f;
  --bg-nav: #0f172a;
  --bg-topbar: #090d16;
  --bg-input: #0f172a;
  --bg-table-header: #0f172a;
  --bg-table-zebra: #101a2b;
  --bg-table-hover: #1e293b;
  --bg-modal-overlay: rgba(0, 0, 0, 0.8);
  --bg-subtle: #0f172a;

  --border: #1e293b;
  --border-subtle: #172033;
  --border-focus: #60a5fa;

  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --text-topbar: #f8fafc;

  --brand: #3b82f6;
  --brand-hover: #60a5fa;
  --brand-light: #1e293b;
  --brand-text: #93c5fd;
  --brand-border: #1e3a8a;

  --ok: #10b981;
  --ok-bg: #064e3b;
  --ok-text: #6ee7b7;
  --ok-border: #047857;

  --warn: #f59e0b;
  --warn-bg: #451a03;
  --warn-text: #fde047;
  --warn-border: #78350f;

  --bad: #ef4444;
  --bad-bg: #450a0a;
  --bad-text: #fca5a5;
  --bad-border: #7f1d1d;

  --info-bg: #1e1b4b;
  --info-text: #c7d2fe;
  --info-border: #312e81;

  --teal-bg: #042f2e;
  --teal-text: #5eead4;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color .25s ease, color .25s ease;
}

.muted { color: var(--text-muted); font-size: 12px; }
.flex { flex: 1; }
[hidden] { display: none !important; }

svg.lucide, .lucide { display: inline-block; vertical-align: middle; width: 1.1em; height: 1.1em; stroke-width: 2px; }
.icon-sm { width: 14px; height: 14px; }
.icon-md { width: 18px; height: 18px; }
.icon-lg { width: 22px; height: 22px; }
.btn-ic { margin-right: 2px; }

.boot, .overlay {
  position: fixed; inset: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--bg-app); color: var(--text-muted);
}
.overlay { background: var(--bg-modal-overlay); color: #fff; backdrop-filter: blur(3px); }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--brand);
  animation: spin .8s linear infinite;
}
.overlay .spinner { border-color: rgba(255,255,255,.3); border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 22px;
  background: var(--bg-topbar); color: var(--text-topbar);
  box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 9px; }
.brand-icon { width: 22px; height: 22px; color: #60a5fa; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.docno { font-size: 11px; opacity: .72; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  padding: 7px 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; cursor: pointer;
  background: rgba(255,255,255,.1); color: #fff;
  font-family: var(--font-sans); font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s ease;
}
.tab:hover { background: rgba(255,255,255,.24); }
.tab.is-active { background: #fff; color: #1e40af; border-color: #fff; }

.who { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who .muted { color: rgba(255,255,255,.72); }

.badge {
  padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .3px;
  background: var(--bg-card); color: var(--brand-text);
}
.badge--new       { background: rgba(255,255,255,.18); color: #fff; }
.badge--draft     { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
.badge--submitted { background: var(--brand-light); color: var(--brand-text); border: 1px solid var(--brand-border); }
.badge--checked   { background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }
.badge--approved  { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
.badge--paid      { background: var(--teal-bg); color: var(--teal-text); }
.badge--rejected  { background: var(--bad-bg); color: var(--bad-text); border: 1px solid var(--bad-border); }
.badge--pending   { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
.badge--active    { background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
.badge--inactive  { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border); }

.view { max-width: 1560px; margin: 0 auto; padding: 22px 20px 104px; }
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; margin-bottom: 18px;
  transition: background-color .25s ease, border-color .25s ease;
}
.card__head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card__title {
  margin: 0 0 14px; font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--text-main); display: flex; align-items: center; gap: 8px;
}
.card__head .card__title { margin: 0; }
.card__actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { margin: 0 0 12px; font-size: 12.5px; color: var(--text-muted); }
.hint kbd {
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: var(--font-mono);
}

.grid-header { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
.field label .en { font-weight: 400; opacity: .75; }
.field .req { color: var(--bad); }

input, select, textarea {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-input); color: var(--text-main);
  font-family: var(--font-sans); font-size: 14px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
input:disabled, select:disabled, textarea:disabled { background: var(--bg-subtle); color: var(--text-muted); }
input.is-invalid { border-color: var(--bad-border); background: var(--bad-bg); }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }

.grid { min-width: 940px; }
.grid th, .grid td {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 0; font-size: 13.5px; vertical-align: middle;
}
.grid th.c-act, .grid td.c-act { border-right: 0; }
.grid thead th {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg-table-header); color: var(--text-muted);
  padding: 10px 12px; text-align: left; font-weight: 700; font-size: 12px;
  letter-spacing: .03em; line-height: 1.3; white-space: nowrap;
}
.grid thead th small { display: block; font-weight: 400; opacity: .7; font-size: 10px; letter-spacing: 0; }
.grid thead th.c-amount, .grid thead th.c-liter { text-align: right; }
.grid thead th.c-no { text-align: center; }

.grid tbody tr { border-left: 4px solid transparent; }
.grid tbody tr:nth-child(even) td { background: var(--bg-table-zebra); }
.grid tbody tr:hover td { background: var(--bg-table-hover); }
.grid tbody tr.is-filled td.c-no { font-weight: 700; color: var(--brand); }

.grid tbody td input, .grid tbody td select {
  border: 0; border-radius: 0; background: transparent;
  padding: 9px 11px; font-size: 13.5px; height: 40px; width: 100%;
}
.grid tbody td input:focus, .grid tbody td select:focus {
  box-shadow: inset 0 0 0 2px var(--brand); border-radius: 6px;
}
.grid tbody td input:disabled, .grid tbody td select:disabled { background: transparent; }
.grid tbody td input.is-dim { color: var(--text-subtle); }

td.c-no, th.c-no { width: 4%; text-align: center; color: var(--text-muted); font-variant-numeric: tabular-nums; }
th.c-date, td.c-date { width: 13%; }
th.c-receiptNo, td.c-receiptNo { width: 14%; }
th.c-description, td.c-description { width: 29%; }
th.c-supportDiv, td.c-supportDiv { width: 9%; }
th.c-type, td.c-type { width: 19%; }
th.c-liter, td.c-liter { width: 12%; }
th.c-amount, td.c-amount { width: 12%; }
td.c-act, th.c-act { width: 4%; min-width: 44px; text-align: center; }
.grid--fuel th.c-description, .grid--fuel td.c-description { width: 36%; }

td.c-amount input, td.c-liter input { text-align: right; font-variant-numeric: tabular-nums; }
td.c-amount input { font-weight: 700; }
.typesel { font-size: 12.5px; }

.grid tfoot td {
  background: var(--bg-table-header); color: var(--brand-text);
  border-top: 2px solid var(--border);
  padding: 12px; font-size: 14px; font-weight: 800;
  text-align: right; font-variant-numeric: tabular-nums;
}
.grid tfoot td.lbl { text-align: left; color: var(--text-muted); }

.rowdel {
  border: 0; background: transparent; cursor: pointer;
  color: var(--text-subtle); font-size: 17px; line-height: 1; padding: 4px 6px;
  border-radius: 6px;
}
.rowdel:hover { color: var(--bad); background: var(--bad-bg); }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.sum-card {
  border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  background: var(--bg-card); box-shadow: var(--shadow-sm);
}
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: 0; }
.swatch--fuel { background: var(--warn); }
.sum-card--fuel { border-color: var(--warn-border); background: var(--warn-bg); }
.sum-card--fuel .val { color: var(--warn-text); }
.sum-card--fuel .acct { color: var(--warn-text); opacity: .85; }
.sum-card h4 { margin: 0 0 2px; font-size: 12.5px; font-weight: 700; color: var(--text-main); }
.sum-card .acct { font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.sum-card .val { margin-top: 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--brand); }

.grand {
  display: flex; align-items: baseline; gap: 10px; justify-content: flex-end;
  margin-top: 16px; padding-top: 14px; border-top: 2px solid var(--border);
}
.grand strong { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--brand); font-variant-numeric: tabular-nums; }
.grand .cur { font-size: 12px; color: var(--text-muted); }
.decision__spend {
  margin: 10px 0 0; display: flex; flex-direction: column; gap: 2px;
  padding-top: 10px; border-top: 1px dashed var(--border);
  font-size: 12px; color: var(--text-muted);
}
.decision__spend b { font-size: 19px; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums; }

.fuelmemo {
  margin: 12px 0 0; display: flex; align-items: baseline; justify-content: flex-end; gap: 8px;
  flex-wrap: wrap; padding: 10px 14px; border-radius: 10px;
  background: var(--warn-bg); border: 1px solid var(--warn-border); border-left: 4px solid var(--warn);
  font-size: 13px; font-weight: 600; color: var(--warn-text);
}
.fuelmemo b { font-size: 16px; font-weight: 800; color: var(--warn-text); font-variant-numeric: tabular-nums; }
.card--fuel { border-left: 4px solid var(--warn); }
.grid--fuel tfoot td { color: var(--warn-text); }

.workflow { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.workflow h3 { margin: 0 0 8px; font-size: 12.5px; color: var(--text-muted); font-weight: 700; }
.workflow ol { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text-muted); }

.errors {
  background: var(--bad-bg); border: 1px solid var(--bad-border); border-left: 4px solid var(--bad);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
}
.errors h4 { margin: 0 0 6px; font-size: 13px; color: var(--bad-text); }
.errors ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--bad-text); }

.btn {
  padding: 9px 16px; border-radius: 8px; border: 1px solid transparent;
  font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .15s ease;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:not(:disabled):hover { background: var(--brand-hover); }
.btn--secondary { background: var(--brand-light); color: var(--brand-text); border-color: var(--brand-border); }
.btn--secondary:not(:disabled):hover { background: var(--bg-card-hover); }
.btn--ghost { background: var(--bg-card); border-color: var(--border); color: var(--text-main); }
.btn--ghost:not(:disabled):hover { background: var(--bg-card-hover); border-color: var(--border-focus); color: var(--brand); }
.btn--sm { padding: 6px 12px; font-size: 12.5px; border-radius: 6px; }
.btn--danger { color: var(--bad-text); border-color: var(--bad-border); background: var(--bad-bg); }
.btn--danger:not(:disabled):hover { background: var(--bad); color: #fff; border-color: var(--bad); }

.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--bg-card);
  border-top: 1px solid var(--border); box-shadow: 0 -4px 14px rgba(0,0,0,.07);
}

.list th, .list td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13.5px; }
.list thead th {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg-table-header); color: var(--text-muted);
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
}
.list td.num, .list th.num { text-align: right; font-variant-numeric: tabular-nums; }
.list tbody tr:hover { background: var(--bg-table-hover); }
.list .rowlink { color: var(--brand); cursor: pointer; font-weight: 600; }
.list .rowlink:hover { color: var(--brand-hover); text-decoration: underline; }
.list td.center, .list th.center { text-align: center; }
.list .row--pending { background: var(--warn-bg); }
.list .mono { font-family: var(--font-mono); font-size: 12.5px; }

.chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.chk input { width: auto; }
.card__actions select, .card__actions input[type="search"] { width: auto; min-width: 150px; }
.minisel { width: auto; min-width: 110px; padding: 5px 9px; font-size: 12.5px; }

.toast {
  position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%);
  z-index: 70; padding: 12px 22px; border-radius: 12px;
  background: var(--bg-topbar); color: var(--text-topbar);
  font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.1);
}
.toast.err { background: var(--bad); color: #fff; }
.toast.ok  { background: var(--ok); color: #fff; }

.authwrap {
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 6vh 20px 40px;
  background: radial-gradient(circle at top, var(--bg-card-hover) 0%, var(--bg-app) 100%);
}
.authcard { width: 100%; max-width: 620px; }
.authtop { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
.authbox {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-lg);
  padding: 30px 32px 26px;
}
.authcard__brand { text-align: center; margin-bottom: 22px; }
.authcard__brand h1 {
  margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--brand);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.authcard__brand .logo-icon { width: 30px; height: 30px; color: var(--brand); }
.authcard__brand .docno { margin: 6px 0 0; color: var(--text-muted); opacity: 1; }

.authtabs {
  display: flex; gap: 4px; padding: 4px; margin-bottom: 20px;
  background: var(--bg-subtle); border-radius: 10px;
}
.authtab {
  flex: 1; padding: 9px 12px; border: 0; border-radius: 8px; cursor: pointer;
  background: transparent; color: var(--text-muted);
  font-family: var(--font-sans); font-size: 13.5px; font-weight: 600;
}
.authtab:hover { color: var(--text-main); }
.authtab.is-active { background: var(--bg-card); color: var(--brand); box-shadow: var(--shadow-sm); }

.authform { display: flex; flex-direction: column; gap: 14px; }
.authgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; }
.btn--block { width: 100%; padding: 11px 16px; font-size: 14px; }
.linkbtn {
  align-self: center; border: 0; background: none; cursor: pointer;
  color: var(--brand); font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  padding: 4px;
}
.linkbtn:hover { color: var(--brand-hover); text-decoration: underline; }
.authcard .errors, .authcard .banner { margin: 16px 0 0; }

.barbtn {
  border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.1); color: #fff;
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
  font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s ease;
}
.barbtn:hover { background: rgba(255,255,255,.25); }
.barbtn--danger { background: rgba(239,68,68,.2); color: #fca5a5; border-color: rgba(239,68,68,.3); }
.barbtn--danger:hover { background: rgba(239,68,68,.38); color: #fff; }
.barbtn--icon { padding: 6px 9px; }

.authtop .barbtn { background: var(--bg-card); color: var(--text-main); border-color: var(--border); }
.authtop .barbtn:hover { background: var(--bg-card-hover); color: var(--brand); }

.chkbox { width: auto; }
