<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K2 Expense System</title>
  <meta name="theme-color" content="#044fa5">
  <meta name="apple-mobile-web-app-title" content="K2 Expense">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    html, body { margin: 0; padding: 0; background: #f4f6fb; overflow: hidden; height: 100%; height: 100svh; }
    iframe { display: block; border: 0; width: 100%; height: 100%; height: 100svh; }
</style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbw-8fEu3AHnyfhDvFBFkWqDdTusDOE-utF2b8aAe7_njCAVRD1_6WR1R1ZYkOJJbCVa/exec"
    title="K2 Expense System"
    allow="clipboard-write"></iframe>

  <script>
  // ส่งต่อ ?module=req / ?req=... ให้แอปข้างใน เช่นไอคอน Expense Approve เดิมที่ชี้มาหน้านี้
  (function () {
    if (!location.search) return;
    var frame = document.querySelector('iframe');
    frame.src = frame.src.split('?')[0] + location.search;
  }());
  </script>

  <script>
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var frame = document.querySelector('iframe');
    function fit() {
      var h = Math.round(vv.height);
      document.documentElement.style.height = h + 'px';
      document.body.style.height = h + 'px';
      frame.style.position = 'fixed';
      frame.style.left = Math.round(vv.offsetLeft) + 'px';
      frame.style.top = Math.round(vv.offsetTop) + 'px';
      frame.style.width = Math.round(vv.width) + 'px';
      frame.style.height = h + 'px';
    }
    fit();
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
    addEventListener('scroll', fit);
    addEventListener('orientationchange', fit);
  }());
  </script>
</body>
</html>
