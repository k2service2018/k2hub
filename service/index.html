<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K2 Service &amp; Equipment Hub</title>
  <meta name="theme-color" content="#4f6ef7">
  <meta name="apple-mobile-web-app-title" content="K2 Service">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f6ef7'/><text x='16' y='22' font-size='16' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>K2</text></svg>">
  <style>
    html, body { margin: 0; padding: 0; background: #f5f6fb; overflow: hidden; height: 100%; height: 100svh; }
    iframe { display: block; border: 0; width: 100%; height: 100%; height: 100svh; }
    /* Full-screen scanner. It lives HERE, in the top-level page, because the
       app itself runs inside Google's sandbox iframe whose permission list
       has no camera on it — getUserMedia is refused there by policy, with no
       prompt and no setting that changes it. This page is a real document on
       its own origin, so the camera behaves normally. */
    #scanWrap { position: fixed; inset: 0; z-index: 9999; background: #000; display: none; }
    #scanReader { width: 100%; height: 100%; }
    /* contain, not cover.
       cover fills the screen by blowing the picture up and cutting the sides
       off — and a phone screen is far taller and narrower than a camera frame,
       so roughly half the width was being hidden. The effect was quietly fatal
       for barcodes: a strip that looked like it spanned half the screen was
       spanning about a fifth of the frame the decoder actually receives, which
       left an EAN-13 with barely two pixels per bar. It also meant people were
       aiming with a picture that was not the picture being read.
       contain shows the whole frame, so what is framed is what is decoded. */
    #scanReader video { width: 100% !important; height: 100% !important;
      object-fit: contain; background: #000; }
    /* Aiming guide only — the decoder now reads the whole frame, so nothing
       outside these corners is lost. Wide enough for the bar strip on a UPS,
       tall enough for a square QR. */
    #scanGuide { position: fixed; left: 6%; right: 6%; top: 50%; transform: translateY(-50%);
      aspect-ratio: 3 / 2; pointer-events: none; z-index: 10000; }
    #scanGuide i { position: absolute; width: 34px; height: 34px; border: 4px solid #fff;
      border-radius: 3px; }
    #scanGuide i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    #scanGuide i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    #scanGuide i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    #scanGuide i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
    #scanBar { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px 30px;
      background: linear-gradient(transparent, rgba(0,0,0,.75)); text-align: center; z-index: 10000; }
    /* The strip the decoder is actually reading, shown as it is read.
       Ten rounds of this were spent reasoning about an image nobody had seen;
       a screenshot of this panel is worth more than any of them. */
    #scanPeek { position: fixed; left: 8px; bottom: 96px; width: 46%; z-index: 10000;
      border: 2px solid rgba(255,255,255,.85); border-radius: 6px; background: #000; }
    #scanPeekLabel { position: fixed; left: 8px; bottom: 78px; z-index: 10000;
      color: #cfd4e0; font: 11px/1.4 sans-serif; }
    #scanBar { display: flex; gap: 10px; justify-content: center; }
    #scanBar button { min-height: 46px; padding: 0 22px; font-size: 15px; font-weight: 600;
      border: 0; border-radius: 10px; background: #fff; color: #333; }
    #scanBar #scanPhoto { background: #4f6ef7; color: #fff; }
    /* The camera's real resolution, on screen. A 1D bar strip lives or dies on
       how many pixels its narrow bars get, and this is the only way to know
       what the phone actually handed over rather than what we asked for. */
    #scanInfo { position: fixed; left: 0; right: 0; top: 46px; text-align: center;
      color: #b9c0d0; font: 12px/1.5 sans-serif; z-index: 10000; }
    #scanMsg { position: fixed; left: 0; right: 0; top: 0; padding: 14px 16px;
      background: rgba(0,0,0,.6); color: #fff; font: 14px/1.5 sans-serif;
      text-align: center; z-index: 10000; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbxQ8mrwRgf21WtqmaPm02AXpQ1ukS8IEt3N3rreMmd3MkHcVw2bEeevY4q4XPvYYKygOg/exec"
    title="K2 Equipment &amp; Service Hub"
    allow="camera; clipboard-write"></iframe>

  <div id="scanWrap">
    <div id="scanMsg">QR: เล็งในกรอบ · บาร์โค้ดแท่ง: เข้าใกล้ให้เต็มความกว้าง ถือนิ่ง</div>
    <div id="scanReader"></div>
    <div id="scanGuide"><i></i><i></i><i></i><i></i></div>
    <div id="scanInfo"></div>
    <img id="scanPeek" alt="">
    <div id="scanPeekLabel">ภาพที่ตัวอ่านได้รับ</div>
    <div id="scanBar">
      <button type="button" id="scanPhoto">📷 ถ่ายรูป</button>
      <button type="button" id="scanClose">ปิดกล้อง</button>
    </div>
    <input type="file" id="scanFile" accept="image/*" capture="environment" style="display:none">
  </div>

  <script>
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var f = document.getElementById('app');
      function fit() {
        var h = Math.round(vv.height);
        document.documentElement.style.height = h + 'px';
        document.body.style.height = h + 'px';
        f.style.position = 'fixed';
        f.style.left = Math.round(vv.offsetLeft) + 'px';
        f.style.top = Math.round(vv.offsetTop) + 'px';
        f.style.width = Math.round(vv.width) + 'px';
        f.style.height = h + 'px';
      }
      fit();
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
      addEventListener('scroll', fit);
      addEventListener('orientationchange', fit);
    }());

    (function () {
      var frame = document.getElementById('app');
      var APP_PREFIX = 'https://script.google.com/macros/s/';
      var OK_ORIGIN = /^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/;
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || typeof d !== 'object') return;
        if (!OK_ORIGIN.test(e.origin)) return;
        if (d.k2 === 'hello') {
          window.__k2handshake = true;
          e.source.postMessage({ k2: 'wrapper' }, '*');
        } else if (d.k2 === 'nav' && typeof d.url === 'string' && d.url.indexOf(APP_PREFIX) === 0) {
          frame.src = d.url;
        } else if (d.k2 === 'scan') {
          // Reply to the exact window that asked. e.source is the app's own
          // frame; frame.contentWindow is Google's page in between, which
          // would not pass the answer on.
          openScanner(e.source);
        }
      });
    }());

    /* The scanner itself. Kept in this page rather than in the app because
       only this page is allowed to open a camera — see the note in the CSS. */
    var scanInst = null;
    var scanResTimer = null;
    var scanBandTimer = null;
    var bandPack = null;
    /* Counters, shown on screen. Several rounds of this hunt were spent fixing
       things that were never running; a number that stays at zero says so in
       one glance. */
    var bandTries = 0, bandSlowest = 0, bandWay = '';
    /* A miss and a broken picture look identical from the outside and need
       opposite fixes, so the reason is spelled out rather than counted. */
    var bandLastErr = '';
    var peekAt = 0;

    /* ZXing on its own, fetched the first time the camera opens rather than
       with the page: the wrapper is otherwise tiny and most visits never scan
       anything. The camera takes longer to warm up than this takes to load. */
    var zxLoad = null;
    function zxReady() {
      if (zxLoad) return zxLoad;
      zxLoad = new Promise(function (ok, bad) {
        if (window.ZXing) return ok(window.ZXing);
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
        s.onload = function () {
          window.ZXing ? ok(window.ZXing) : bad(new Error('ตัวอ่านโหลดไม่ครบ'));
        };
        s.onerror = function () { bad(new Error('โหลดตัวอ่านบาร์โค้ดไม่สำเร็จ')); };
        document.head.appendChild(s);
      });
      return zxLoad;
    }

    /* Pin the darkest 2% to black and the brightest 2% to white. The 1D reader
       judges each row of pixels by that row's own histogram, so a strip shot
       under room light — grey bars on grey card, not black on white — sits in
       too narrow a band of greys for it to find an edge. Widening the range is
       the one cheap thing that fixes that. */
    function stretchGrey(cv) {
      var g = cv.getContext('2d');
      var d = g.getImageData(0, 0, cv.width, cv.height), p = d.data;
      var hist = new Uint32Array(256), n = p.length / 4, i;
      for (i = 0; i < p.length; i += 4) {
        var y = (p[i] * 77 + p[i + 1] * 151 + p[i + 2] * 28) >> 8;
        p[i] = p[i + 1] = p[i + 2] = y;
        hist[y]++;
      }
      var lo = 0, hi = 255, acc = 0, cut = n * 0.02;
      for (i = 0; i < 256; i++) { acc += hist[i]; if (acc >= cut) { lo = i; break; } }
      acc = 0;
      for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= cut) { hi = i; break; } }
      if (hi - lo < 20) { lo = 0; hi = 255; }   // nothing to stretch; leave it
      var sc = 255 / (hi - lo);
      for (i = 0; i < p.length; i += 4) {
        var v = (p[i] - lo) * sc;
        p[i] = p[i + 1] = p[i + 2] = v < 0 ? 0 : (v > 255 ? 255 : v);
      }
      g.putImageData(d, 0, 0);
      return cv;
    }

    /* The reader is built when the camera opens and dropped when it closes.
       Keeping one alive across sessions looked tidier and was the cause of the
       strangest symptom in this whole hunt: the first barcode of a session
       read, and every one after it failed. */
    function dropBandReader() {
      bandPack = null;
    }
    var scanAsker = null;

    function scanTell(msg) {
      if (scanAsker) { try { scanAsker.postMessage(msg, '*'); } catch (e) {} }
    }

    function closeScanner(msg) {
      var wrap = document.getElementById('scanWrap');
      wrap.style.display = 'none';
      var inst = scanInst;
      scanInst = null;
      if (scanResTimer) { clearInterval(scanResTimer); scanResTimer = null; }
      if (scanBandTimer) { clearTimeout(scanBandTimer); scanBandTimer = null; }
      dropBandReader();
      var info = document.getElementById('scanInfo');
      if (info) info.textContent = '';
      var peek = document.getElementById('scanPeek');
      if (peek) peek.removeAttribute('src');
      if (msg) scanTell(msg);
      scanAsker = null;
      if (inst) { inst.stop().then(function () { inst.clear(); }).catch(function () {}); }
    }

    function openScanner(source) {
      if (scanInst) return;
      scanAsker = source;
      var wrap = document.getElementById('scanWrap');
      wrap.style.display = 'block';
      document.getElementById('scanMsg').textContent = 'กำลังเปิดกล้อง...';
      // Tell the app at once that the camera is ours now. Without this it
      // cannot tell a wrapper that is working from one too old to know what
      // a scan request is, and it would fall back to a photo mid-scan.
      scanTell({ k2: 'scanOpen' });
      var inst = new Html5Qrcode('scanReader');
      scanInst = inst;
      inst.start(
        { facingMode: 'environment' },
        {
          fps: 10
          // No qrbox on purpose: it is a CROP, and whatever falls outside it is
          // thrown away. A square crop suits the QR on a K2 serial label and
          // cuts the ends off the long bar strip on a UPS; a landscape one does
          // the opposite. Decoding the whole frame serves both, and the guide
          // drawn over the video is now only a hint about where to aim.
        },
        function (text) {
          var value = String(text || '').trim();
          if (value) closeScanner({ k2: 'scanned', text: value });
        },
        function () { /* a miss per frame is normal */ }
      ).then(function () {
        document.getElementById('scanMsg').textContent = 'QR: เล็งในกรอบ · บาร์โค้ดแท่ง: เข้าใกล้ให้เต็มความกว้าง ถือนิ่ง';
        /* Ask for a sharper stream now that the camera is running.

           This is the whole difference for the bar strip on a UPS. Left to
           itself Safari hands over about 720p, where the narrow bars land two
           pixels wide and no decoder can separate them — measured: the same
           strip that never read at 720p reads in 200ms at 1080p. A QR is coarse
           enough not to care, which is why only the barcodes were failing.

           Applied here rather than in start()'s constraints because passing
           width/height there makes html5-qrcode reject the start outright, and
           then nothing scans at all. A camera that cannot go higher simply
           keeps what it has. */
        inst.applyVideoConstraints({ width: { ideal: 1920 }, height: { ideal: 1080 } })
          .catch(function () { /* keep whatever the camera gives */ });

        // Show what we ended up with. The request above is a wish, not an order.
        if (scanResTimer) clearInterval(scanResTimer);
        scanResTimer = setInterval(function () {
          var v = document.querySelector('#scanReader video');
          var el = document.getElementById('scanInfo');
          if (!v || !el) return;
          el.textContent = (v.videoWidth
            ? ('กล้อง ' + v.videoWidth + ' x ' + v.videoHeight)
            : 'ยังไม่มีภาพจากกล้อง') +
            ' · รอบ ' + bandTries +
            (bandWay ? (' · ' + bandWay) : '') +
            (bandSlowest ? (' · ' + bandSlowest + 'ms') : '') +
            (bandLastErr ? (' · ' + bandLastErr) : '');
        }, 700);

        /* Keep the lens hunting. Held close to a barcode the camera can settle
           on the wrong distance and simply stay there — the bars go soft and no
           amount of resolution helps. Asked of the track directly because
           html5-qrcode's own constraint call rejects anything it does not
           recognise. A camera without the control ignores this. */
        try {
          var vEl = document.querySelector('#scanReader video');
          var track = vEl && vEl.srcObject && vEl.srcObject.getVideoTracks
            ? vEl.srcObject.getVideoTracks()[0] : null;
          if (track && track.applyConstraints) {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] })
              .catch(function () { /* not supported here */ });
          }
        } catch (e) { /* not supported here */ }

        startBandPass();
      }).catch(function () {
        // Even here the camera can be refused — in an in-app browser, or if
        // the user has said no. Tell the app so it can offer a photo instead.
        scanInst = null;
        closeScanner({ k2: 'scanFail' });
      });
    }

    /* A second pass over the same picture, at the camera's real resolution and
       through ZXing directly rather than through html5-qrcode.

       Two separate reasons, both measured. First, html5-qrcode's own loop
       decodes from a canvas the size of the video ELEMENT — 568px wide while
       the camera was sending 1080, nearer 390 on a phone. A QR survives that;
       the narrow bars of a 1D barcode do not. So this takes a band across the
       middle of the frame at full sensor width.

       Second, its scanFile path lays the picture on a canvas 100px larger on
       every side and pins ZXing's TRY_HARDER hint to false. That black border
       joins the histogram of every row the 1D reader samples — and for a bar
       strip that histogram IS the decoder, which is why the same barcode would
       read once and then never, and why trimming twenty pixels off one edge
       could flip the result. Side by side on nine hand-held frames (blurred,
       washed out, glared, small): html5-qrcode read 2, this reads 7, and a
       miss costs 68ms instead of 1258ms.

       QR is left alone — that still comes from html5-qrcode's own loop on the
       video, which has always worked. */
    function startBandPass() {
      if (scanBandTimer) clearTimeout(scanBandTimer);
      dropBandReader();
      bandTries = 0; bandSlowest = 0; bandWay = '';
      bandLastErr = 'กำลังโหลดตัวอ่าน...';

      var Z = null;
      zxReady().then(function (z) {
        Z = z;
        var h = new Map();
        h.set(z.DecodeHintType.POSSIBLE_FORMATS, [
          z.BarcodeFormat.EAN_13, z.BarcodeFormat.EAN_8,
          z.BarcodeFormat.UPC_A, z.BarcodeFormat.UPC_E,
          z.BarcodeFormat.CODE_128, z.BarcodeFormat.CODE_39,
          z.BarcodeFormat.CODE_93, z.BarcodeFormat.ITF, z.BarcodeFormat.CODABAR
        ]);
        bandPack = { reader: new z.MultiFormatOneDReader(h), hints: h };
        bandLastErr = '';
      }).catch(function (e) {
        bandLastErr = String((e && e.message) || e).slice(0, 42);
      });

      function read(cv) {
        try {
          var src = new Z.HTMLCanvasElementLuminanceSource(cv);
          var res = bandPack.reader.decode(
            new Z.BinaryBitmap(new Z.HybridBinarizer(src)), bandPack.hints);
          return String((res && res.getText()) || '').trim();
        } catch (e) { return ''; }      // a miss throws; that is the normal case
      }

      var cv = document.createElement('canvas');
      var cs = document.createElement('canvas');
      var tick = 0;

      /* Each pass is scheduled after the last one finishes rather than on a
         fixed timer: decoding blocks the main thread, and a fixed interval
         shorter than the work simply queues up passes and freezes the
         preview. A fixed gap keeps the picture moving. */
      function pass() {
        scanBandTimer = null;
        if (!scanInst) return;
        var again = function () {
          if (scanInst) scanBandTimer = setTimeout(pass, 60);
        };
        var v = document.querySelector('#scanReader video');
        if (!v || !v.videoWidth || !Z || !bandPack) return again();

        var startedAt = Date.now();
        bandTries++;
        var vw = v.videoWidth, vh = v.videoHeight;
        var bandH = Math.max(1, Math.round(vh * 0.5));
        cv.width = vw; cv.height = bandH;
        cv.getContext('2d').drawImage(v, 0, Math.round((vh - bandH) / 2), vw, bandH,
          0, 0, vw, bandH);

        var shown = cv;
        var hit = read(cv);
        if (hit) bandWay = 'ปกติ';

        /* A second look at the same frame with the contrast pulled open. It
           costs about as much again, so it runs on every other pass — it is
           what rescues a strip shot under room light, which arrives grey on
           grey rather than black on white. */
        if (!hit && (tick++ & 1)) {
          cs.width = vw; cs.height = bandH;
          cs.getContext('2d').drawImage(cv, 0, 0);
          stretchGrey(cs);
          shown = cs;
          hit = read(cs);
          if (hit) bandWay = 'คอนทราสต์';
        }

        bandSlowest = Math.max(bandSlowest, Date.now() - startedAt);
        if (!hit) bandLastErr = 'ไม่พบรหัส';

        if (Date.now() - peekAt > 900) {
          peekAt = Date.now();
          var peek = document.getElementById('scanPeek');
          if (peek) peek.src = shown.toDataURL('image/jpeg', 0.6);
        }

        if (hit && scanInst) return closeScanner({ k2: 'scanned', text: hit });
        again();
      }
      pass();
    }

    document.getElementById('scanClose').addEventListener('click', function () {
      closeScanner({ k2: 'scanCancel' });
    });

    /* Reading a code out of a still photo, as a second route beside the live
       one. It exists because a 1D bar strip — the kind on a UPS — reads from a
       photo but not, so far, from the live feed: the bars come through the
       video too thin to separate, while a QR is coarse enough to survive.

       The capture happens HERE rather than down in the app because the picker
       needs a real user gesture, and a gesture does not survive a postMessage
       hop into another frame. */
    document.getElementById('scanPhoto').addEventListener('click', function () {
      document.getElementById('scanFile').click();
    });

    document.getElementById('scanFile').addEventListener('change', function () {
      var input = this;
      var file = input.files && input.files[0];
      input.value = '';                       // let the same shot be retaken
      if (!file) return;
      var msg = document.getElementById('scanMsg');
      msg.textContent = 'กำลังอ่านรูป...';

      /* iOS caps a canvas near 16.7M pixels and a modern iPhone shoots 24-48MP;
         over the cap the canvas comes back blank rather than failing, so the
         decoder would be handed an empty image. Shrink first. */
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, 1600 / Math.max(w, h, 1));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * scale));
        cv.height = Math.max(1, Math.round(h * scale));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        msg.textContent = 'กำลังอ่านรูป ' + w + 'x' + h + '...';
        cv.toBlob(function (blob) {
          var holder = document.createElement('div');
          holder.id = 'photoScan_' + Date.now();
          holder.style.display = 'none';
          document.body.appendChild(holder);
          var drop = function () { if (holder.parentNode) holder.parentNode.removeChild(holder); };
          new Html5Qrcode(holder.id)
            .scanFile(new File([blob], 'scan.jpg', { type: 'image/jpeg' }), false)
            .then(function (text) {
              drop();
              var value = String(text || '').trim();
              if (value) closeScanner({ k2: 'scanned', text: value });
              else msg.textContent = 'ไม่พบรหัสในรูปนี้ ลองใหม่';
            })
            .catch(function () {
              drop();
              msg.textContent = 'อ่านไม่สำเร็จ (รูป ' + w + 'x' + h + ') — ถ่ายให้รหัสเต็มกรอบและชัด';
            });
        }, 'image/jpeg', 0.92);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        msg.textContent = 'เปิดรูปไม่ได้ ลองใหม่';
      };
      img.src = url;
    });
  </script>
</body>
</html>
