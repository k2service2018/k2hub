<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K2 Service &amp; Equipment Hub</title>
  <meta name="theme-color" content="#4f6ef7">
  <meta name="apple-mobile-web-app-title" content="K2 Hub">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f6ef7'/><text x='16' y='22' font-size='16' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>K2</text></svg>">
  <style>
    html, body { margin: 0; padding: 0; background: #f5f6fb; overflow: hidden; height: 100%; height: 100svh; }
    iframe { display: block; border: 0; width: 100%; height: 100%; height: 100svh; }
  </style>
</head>
<body>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbxQ8mrwRgf21WtqmaPm02AXpQ1ukS8IEt3N3rreMmd3MkHcVw2bEeevY4q4XPvYYKygOg/exec"
    title="K2 Equipment &amp; Service Hub"
    allow="camera; clipboard-write"></iframe>

  <script>
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var f = document.getElementById('app');
      function fit() {
        var h = Math.round(vv.height);
        document.documentElement.style.height = h + 'px';
        document.body.style.height = h + 'px';
        f.style.position = 'fixed';
        f.style.left = Math.round(vv.offsetLeft) + 'px';
        f.style.top = Math.round(vv.offsetTop) + 'px';
        f.style.width = Math.round(vv.width) + 'px';
        f.style.height = h + 'px';
      }
      fit();
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
      addEventListener('scroll', fit);
      addEventListener('orientationchange', fit);
    }());

    if (location.hash === '#diag') (function () {
      var f = document.getElementById('app');
      var band = document.createElement('div');
      band.style.cssText = 'position:fixed;left:0;right:0;height:28px;z-index:9;' +
        'background:#dc2626;color:#fff;font:bold 13px/28px monospace;text-align:center;pointer-events:none';
      band.textContent = 'ขอบบนของเฟรม';
      document.body.appendChild(band);
      var box = document.createElement('pre');
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0;' +
        'background:#0f172a;color:#e2e8f0;font:11px/1.5 monospace;padding:8px 10px;pointer-events:none';
      document.body.appendChild(box);
      var vv = window.visualViewport;
      function n(v) { return (v == null) ? '-' : Math.round(v); }
      function read() {
        var r = f.getBoundingClientRect();
        band.style.top = r.top + 'px';
        box.textContent =
          'BUILD                 service-A\n' +
          'iframe position       ' + getComputedStyle(f).position + '\n' +
          'window.innerHeight    ' + n(window.innerHeight) + '\n' +
          'doc.clientHeight      ' + n(document.documentElement.clientHeight) + '\n' +
          'visualViewport.height ' + n(vv && vv.height) + '\n' +
          'visualViewport.top    ' + n(vv && vv.offsetTop) + '\n' +
          'window.scrollY        ' + n(window.scrollY) + '\n' +
          'iframe rect.top       ' + n(r.top) + '\n' +
          'iframe rect.height    ' + n(r.height);
      }
      read();
      setInterval(read, 500);
    }());

    (function () {
      var frame = document.getElementById('app');
      var APP_PREFIX = 'https://script.google.com/macros/s/';
      var OK_ORIGIN = /^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/;
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || typeof d !== 'object') return;
        if (!OK_ORIGIN.test(e.origin)) return;
        if (d.k2 === 'hello') {
          window.__k2handshake = true;
          e.source.postMessage({ k2: 'wrapper' }, '*');
        } else if (d.k2 === 'nav' && typeof d.url === 'string' && d.url.indexOf(APP_PREFIX) === 0) {
          frame.src = d.url;
        }
      });
    }());
  </script>
</body>
</html>
